            syncAgentViewState();
            requestNextPendingAgentReport();
            return;
          }

          if (msg.type === 'apollo-text-report-ready') {
            textReportMeta = msg.payload || null;
            syncAgentViewState();
            requestNextPendingAgentReport();
            return;
          }

          if (msg.type === 'apollo-agent-source') {
            setAgentDialogueSource(msg.payload?.source, false);
            return;
          }

          if (msg.type === 'apollo-proxy-status') {
            renderApolloProxyStatus(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-started') {
            handleAgentStarted(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-progress') {
            handleAgentProgress(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-result') {
            handleAgentResult(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-cancelled') {
            const cancelledKind = agentActiveRequestKind || 'report';
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            agentActiveRequestKind = null;
            removeAgentLoadingMessage(cancelledKind);
            syncAgentViewState();
            requestNextPendingAgentReport();
            return;
          }

          if (msg.type === 'apollo-generation-started') {
            handleGenerationStarted(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-generation-progress') {
            handleGenerationProgress(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-generation-result') {
            handleGenerationResult(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-generation-cancelled') {
            generationRequestInProgress = false;
            generationActiveRequestId = null;
            removeAgentLoadingMessage('generation');
            addAgentMessage({
              role: 'assistant',
              text: 'Генерация остановлена.',
            }, 'generation');
            syncAgentViewState();
            return;
          }

          if (msg.type === 'catalog-file-loaded') {
            handleCatalogFileLoaded(msg.payload);
          }

          if (msg.type === 'catalog-loading') {
            catalogsLoading = true;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast('Загрузка…');
          }

          if (msg.type === 'catalog-ready') {
            catalogsLoading = false;
            catalogsReady = true;
            if (!isScanning) {
              actionPhase = 'idle';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast('Готово');
          }

          if (msg.type === 'catalog-error') {
            catalogsLoading = false;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast(
              msg.payload?.message ?? 'Не удалось загрузить справочники',
            );
          }
        };

        parent.postMessage(
          { pluginMessage: { type: 'ui-ready' } },
          '*',
        );

        function showToast(message) {
          if (!toastEl) return;
          toastEl.textContent = message;
          toastEl.classList.add('visible');
          setTimeout(() => {
            toastEl?.classList.remove('visible');
          }, 3000);
        }

        function renderStatsDeliveryStatus(payload) {
          if (!statsDeliveryStatusEl) {
            return;
          }
          if (statsDeliverySuccessTimerId) {
            clearTimeout(statsDeliverySuccessTimerId);
            statsDeliverySuccessTimerId = null;
          }
          const phase = String(payload?.phase || 'idle');
          if (phase === 'idle') {
            statsDeliveryStatusEl.hidden = true;
            return;
          }
          statsDeliveryStatusEl.hidden = false;
          statsDeliveryStatusEl.dataset.phase = phase;
          statsDeliveryStatusEl.disabled = phase !== 'failed';
          statsDeliveryStatusEl.title = payload?.lastError || '';
          if (phase === 'failed') {
            const pendingCount = Number(payload?.pendingCount || 0);
            statsDeliveryStatusEl.textContent = pendingCount > 0
              ? `Не отправлено: ${pendingCount} · Повторить`
              : 'Ошибка отправки · Повторить';
            return;
          }
          statsDeliveryStatusEl.textContent = phase === 'success'
            ? 'Отчёты отправлены'
            : 'Отправляем отчёты…';
          if (phase === 'success') {
            statsDeliverySuccessTimerId = setTimeout(() => {
              statsDeliveryStatusEl.hidden = true;
              statsDeliverySuccessTimerId = null;
            }, 4000);
          }
        }

        statsDeliveryStatusEl?.addEventListener('click', () => {
          if (statsDeliveryStatusEl.dataset.phase !== 'failed') {
            return;
          }
          statsDeliveryStatusEl.disabled = true;
          statsDeliveryStatusEl.dataset.phase = 'uploading';
          statsDeliveryStatusEl.textContent = 'Отправляем отчёты…';
          parent.postMessage(
            { pluginMessage: { type: 'retry-stats-upload' } },
            '*',
          );
        });

        function downloadJsonDocument(payloadDocument, suggestedFileName) {
          if (!payloadDocument) {
            showToast('Apollo не вернул данные примера');
            return;
          }
          const fileName =
            typeof suggestedFileName === 'string' && suggestedFileName.trim()
              ? suggestedFileName.trim()
              : 'apollo.generation-example-candidate.json';
          const blob = new Blob(
            [JSON.stringify(payloadDocument, null, 2)],
            { type: 'application/json;charset=utf-8' },
          );
          const objectUrl = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = objectUrl;
          anchor.download = fileName;
          anchor.style.display = 'none';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
        }

        function showCatalogToast(message) {
          showToast(truncateToastText(message, 16));
        }

        function truncateToastText(value, maxLength) {
          const text = String(value ?? '').trim();
          if (text.length <= maxLength) {
            return text;
          }
          return `${text.slice(0, Math.max(0, maxLength - 1))}…`;
        }

        function openAgentDialogue() {
          if (agentDialogueOpen) {
            return;
          }
          agentDialogueOpen = true;
          requestApolloProxyStatus();
          renderAgentMessages();
          syncAgentViewState();
          requestAnimationFrame(() => {
            agentComposerInput?.focus();
          });
        }

        function setAgentDialogueSource(value, persistSelection) {
          if (agentRequestInProgress && persistSelection) {
            return;
          }
          const nextSource = value === 'codex' ? 'codex' : 'langflow';
          agentDialogueSource = nextSource;
          syncAgentSourceControl();
          if (persistSelection) {
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'set-apollo-agent-source',
                  payload: { source: nextSource },
                },
              },
              '*',
            );
          }
        }

        function setAgentDialogueMode(value) {
          if (agentRequestInProgress || generationRequestInProgress) {
            return;
          }
          agentDialogueMode = value === 'generation' ? 'generation' : 'question';
          if (agentDialogueMode === 'generation') {
            requestApolloProxyStatus();
          }
          renderAgentMessages();
          syncAgentViewState();
          requestAnimationFrame(() => agentComposerInput?.focus());
        }

        function syncAgentDialogueModeControl() {
          const requestInProgress =
            agentRequestInProgress || generationRequestInProgress;
          agentDialogueModeButtons.forEach((button) => {
            const selected =
              button.dataset.agentDialogueMode === agentDialogueMode;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', selected ? 'true' : 'false');
            button.disabled = requestInProgress;
          });
          agentChatOverlay?.classList.toggle(
            'generation-mode',
            agentDialogueOpen && agentDialogueMode === 'generation',
          );
        }

        function requestApolloProxyStatus() {
          parent.postMessage(
            {
              pluginMessage: {
                type: 'get-apollo-proxy-status',
              },
            },
            '*',
          );
        }

        function renderApolloProxyStatus(payload) {
          if (!agentProxyVersion) {
            return;
          }
          const available = payload?.available === true;
          const version = typeof payload?.version === 'string'
            ? payload.version.trim()
            : '';
          agentProxyVersion.textContent = available
            ? version
              ? `Proxy v${version}`
              : 'Proxy подключён'
            : 'Proxy недоступен';
          agentProxyVersion.classList.toggle('unavailable', !available);
          agentProxyVersion.title = available && version
            ? `Локальный Apollo Proxy, версия ${version}`
            : 'Локальный Apollo Proxy недоступен';
        }

        function syncAgentSourceControl() {
          agentSourceButtons.forEach((button) => {
            const selected = button.dataset.agentSource === agentDialogueSource;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', selected ? 'true' : 'false');
            button.disabled = agentRequestInProgress;
          });
        }

        function closeAgentDialogue(restoreLauncherFocus) {
          if (!agentDialogueOpen) {
            return;
          }
          agentDialogueOpen = false;
          renderAgentMessages();
          syncAgentViewState();
          requestNextPendingAgentReport();
          if (restoreLauncherFocus) {
            agentChatLauncher?.focus();
          }
        }

        function setActiveApolloView(nextView) {
          if (
            nextView !== 'audit' &&
            nextView !== 'report' &&
            nextView !== 'texts'
          ) {
            return;
          }

          activeApolloView = nextView;
          renderAgentMessages();
          syncAgentViewState();
          requestNextPendingAgentReport();
        }

        function requestNextPendingAgentReport() {
          if (agentDialogueOpen || agentRequestInProgress) {
            return;
          }
          const patternReportId = patternReportMeta?.reportId || null;
          if (
            patternReportId &&
            agentRequestedPatternReportId !== patternReportId
          ) {
            agentRequestedPatternReportId = patternReportId;
            sendAgentReportToProxy('', 'report');
            return;
          }
          const textReportId = textReportMeta?.reportId || null;
          if (
            activeApolloView === 'texts' &&
            textReportId &&
            agentRequestedTextReportId !== textReportId
          ) {
            agentRequestedTextReportId = textReportId;
            sendAgentReportToProxy('', 'texts');
          }
        }

        function retryActiveAgentRequest() {
          if (agentRequestInProgress || generationRequestInProgress) {
            return;
          }

          if (agentDialogueOpen) {
            if (agentDialogueMode === 'generation' && agentLastGenerationPrompt) {
              sendApolloLayoutGeneration(agentLastGenerationPrompt);
            } else if (agentDialogueMode === 'question' && agentLastQuestion) {
              sendAgentReportToProxy(agentLastQuestion);
            }
            return;
          }

          if (activeApolloView === 'report') {
            if (patternReportMeta) {
              sendAgentReportToProxy('', 'report');
            }
            return;
          }

          if (activeApolloView === 'texts' && textReportMeta) {
            sendAgentReportToProxy('', 'texts');
          }
        }

        function handleAgentComposerSubmit(event) {
          event?.preventDefault?.();

          if (!agentDialogueOpen) {
            return;
          }

          if (agentDialogueMode === 'generation' && generationRequestInProgress) {
            cancelApolloLayoutGeneration();
            return;
          }

          if (agentDialogueMode === 'question' && agentRequestInProgress) {
            if (agentActiveRequestKind === 'question') {
              cancelAgentReportRequest();
            }
            return;
          }

          const userMessage = agentComposerInput?.value?.trim() || '';
          if (!userMessage) {
            return;
          }

          if (agentDialogueMode === 'generation') {
            agentLastGenerationPrompt = userMessage;
          } else {
            agentLastQuestion = userMessage;
          }
          addAgentMessage({
            role: 'user',
            text: userMessage,
          }, agentDialogueMode === 'generation' ? 'generation' : 'question');

          if (agentComposerInput) {
            agentComposerInput.value = '';
            resizeAgentComposerInput();
          }

          if (agentDialogueMode === 'generation') {
            sendApolloLayoutGeneration(userMessage);
          } else {
            sendAgentReportToProxy(userMessage);
          }
        }

        function cancelAgentReportRequest() {
          if (!agentRequestInProgress) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'cancel-apollo-agent-report',
                payload: { requestId: agentActiveRequestId },
              },
            },
            '*',
          );
        }

        function cancelApolloLayoutGeneration() {
          if (!generationRequestInProgress) {
            return;
          }
          parent.postMessage(
            {
              pluginMessage: {
                type: 'cancel-apollo-layout-generation',
                payload: { requestId: generationActiveRequestId },
              },
            },
            '*',
          );
        }

        function resizeAgentComposerInput() {
          if (!agentComposerInput) {
            return;
          }

          agentComposerInput.style.height = '0px';
          const height = Math.min(
            Math.max(agentComposerInput.scrollHeight, 56),
            196,
          );
          agentComposerInput.style.height = `${height}px`;
        }

        function sendAgentReportToProxy(userMessage, requestedKind) {
          const normalizedUserMessage =
            typeof userMessage === 'string' ? userMessage.trim() : '';
          const requestKind = normalizedUserMessage
            ? 'question'
            : requestedKind === 'texts'
              ? 'texts'
              : 'report';

          if (agentRequestInProgress) {
            return;
          }

          if (requestKind === 'report' && !patternReportMeta) {
            return;
          }
          if (requestKind === 'texts' && !textReportMeta) {
            return;
          }

          if (requestKind === 'report' && hasAgentSystemState('report')) {
            agentReportMessages = [];
            renderAgentMessages();
          }

          if (requestKind === 'question' && hasAgentSystemState('question')) {
            agentDialogueMessages = [];
            renderAgentMessages();
          }
          if (requestKind === 'texts' && hasAgentSystemState('texts')) {
            agentTextMessages = [];
            renderAgentMessages();
          }

          agentMessageSequence += 1;
          const requestId = `apollo-agent-${Date.now()}-${agentMessageSequence}`;
          agentActiveRequestId = requestId;
          agentActiveRequestKind = requestKind;
          agentRequestInProgress = true;
          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text:
              requestKind === 'texts'
                ? 'Агент проверяет тексты'
                : requestKind === 'question'
                  ? 'Apollo думает'
                  : 'Проверяем паттерны',
          }, requestKind);
          syncAgentViewState();

          const dialogueContext = requestKind === 'question'
            ? agentDialogueMessages
                .filter((message) =>
                  (message.role === 'user' || message.role === 'assistant') &&
                  message.variant !== 'loading' &&
                  typeof message.text === 'string' &&
                  message.text.trim(),
                )
                .slice(0, -1)
                .slice(-12)
                .map((message) => ({
                  role: message.role,
                  text: message.text,
                }))
            : [];

          parent.postMessage(
            {
              pluginMessage: {
                type: 'send-apollo-agent-report',
                payload: {
                  requestId,
                  userMessage: normalizedUserMessage,
                  reportType:
                    requestKind === 'report'
                      ? 'patterns'
                      : requestKind === 'texts'
                        ? 'texts'
                        : null,
                  agentSource:
                    requestKind === 'question' ? agentDialogueSource : null,
                  dialogue: dialogueContext,
                },
              },
            },
            '*',
          );
        }

        function buildGenerationDialogue(currentPrompt) {
          const dialogue = agentGenerationMessages
            .filter((message) =>
              message.id !== 'apollo-generation-intro' &&
              message.variant !== 'loading' &&
              (message.role === 'user' || message.role === 'assistant') &&
              typeof message.text === 'string' &&
              message.text.trim()
            )
            .map((message) => ({
              role: message.role,
              text: message.text.trim(),
            }));
          const lastMessage = dialogue[dialogue.length - 1];
          if (
            lastMessage &&
            lastMessage.role === 'user' &&
            lastMessage.text === currentPrompt
          ) {
            dialogue.pop();
          }
          if (dialogue.length <= 16) {
            return dialogue;
          }
          const firstUser = dialogue.find((entry) => entry.role === 'user');
          const recent = dialogue.slice(firstUser ? -15 : -16);
          if (firstUser && !recent.includes(firstUser)) {
            return [firstUser, ...recent];
          }
          return recent;
        }

        function sendApolloLayoutGeneration(prompt) {
          const normalizedPrompt =
            typeof prompt === 'string' ? prompt.trim() : '';
          if (!normalizedPrompt || generationRequestInProgress) {
            return;
          }

          if (hasAgentSystemState('generation')) {
            agentGenerationMessages = [];
            generationOriginalBrief = '';
            generationClarificationRound = 0;
            renderAgentMessages();
          }

          if (!generationOriginalBrief) {
            const firstUserMessage = agentGenerationMessages.find((message) =>
              message.role === 'user' &&
              typeof message.text === 'string' &&
              message.text.trim()
            );
            generationOriginalBrief = firstUserMessage?.text?.trim() || normalizedPrompt;
          }

          agentMessageSequence += 1;
          const requestId =
            `apollo-generation-${Date.now()}-${agentMessageSequence}`;
          generationActiveRequestId = requestId;
          generationRequestInProgress = true;
          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text: 'Подбираем паттерн или рецепт и компоненты',
          }, 'generation');
          syncAgentViewState();

          parent.postMessage(
            {
              pluginMessage: {
                type: 'generate-apollo-layout',
                payload: {
                  requestId,
                  prompt: normalizedPrompt,
                  brief: generationOriginalBrief,
                  dialogue: buildGenerationDialogue(normalizedPrompt),
                  clarificationRound: generationClarificationRound,
                },
              },
            },
            '*',
          );
        }

        function handleGenerationStarted(payload) {
          if (
            payload.requestId &&
            generationActiveRequestId &&
            payload.requestId !== generationActiveRequestId
          ) {
            return;
          }
          generationActiveRequestId =
            payload.requestId || generationActiveRequestId;
          generationRequestInProgress = true;
          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text: payload.message || 'Подбираем паттерн или рецепт и компоненты',
          }, 'generation');
          syncAgentViewState();
        }

        function handleGenerationProgress(payload) {
          if (
            payload.requestId &&
            generationActiveRequestId &&
            payload.requestId !== generationActiveRequestId
          ) {
            return;
          }
          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text: payload.message || 'Собираем макет в Figma',
          }, 'generation');
        }

        function handleGenerationResult(payload) {
          if (
            payload.requestId &&
            generationActiveRequestId &&
            payload.requestId !== generationActiveRequestId
          ) {
            return;
          }
          generationRequestInProgress = false;
          generationActiveRequestId = null;
          removeAgentLoadingMessage('generation');

          if (payload.error) {
            agentMessageSequence += 1;
            setAgentMessages('generation', [{
              id: `agent-message-${agentMessageSequence}`,
              role: 'error',
              text: `Не удалось создать макет\n${payload.error}`,
            }]);
          } else {
            if (payload.clarificationRequired) {
              generationClarificationRound = Math.min(
                4,
                generationClarificationRound + 1,
              );
            } else {
              generationClarificationRound = 0;
            }
            addAgentMessage({
              role: 'assistant',
              text: payload.text || 'Макет создан и выделен на странице.',
              clarificationRequired: payload.clarificationRequired === true,
              blocked: payload.blocked === true,
            }, 'generation');
          }
          renderAgentMessages();
          syncAgentViewState();
        }

        function handleAgentStarted(payload) {
          if (payload.requestId && payload.requestId !== agentActiveRequestId) {
            agentActiveRequestId = payload.requestId;
          }
          agentActiveRequestKind = payload.requestKind || agentActiveRequestKind || 'report';
          agentRequestInProgress = true;
          syncAgentViewState();

          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text:
              agentActiveRequestKind === 'question'
                ? 'Apollo думает'
                : 'Агент анализирует отчёт',
          }, agentActiveRequestKind);
        }

        function handleAgentProgress(payload) {
          if (
            payload.requestId &&
            agentActiveRequestId &&
            payload.requestId !== agentActiveRequestId
          ) {
            return;
          }
          const requestKind =
            payload.requestKind || agentActiveRequestKind || 'report';
          const message =
            typeof payload.message === 'string' && payload.message.trim()
              ? payload.message.trim()
              : 'Агент анализирует отчёт';
          const progress = Number(payload.progress);
          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text: Number.isFinite(progress)
              ? `${message} · ${Math.round(progress)}%`
              : message,
          }, requestKind);
        }

        function handleAgentResult(payload) {
          if (
            payload.requestId &&
            agentActiveRequestId &&
            payload.requestId !== agentActiveRequestId
          ) {
            return;
          }

          const requestKind =
            payload.requestKind || agentActiveRequestKind || 'report';
          agentRequestInProgress = false;
          agentActiveRequestId = null;
          agentActiveRequestKind = null;

          removeAgentLoadingMessage(requestKind);

          if (payload.error) {
            agentMessageSequence += 1;
            setAgentMessages(requestKind, [
              {
                id: `agent-message-${agentMessageSequence}`,
                role: 'error',
                text:
                  `Агент сейчас недоступен\n${
                    payload.error ||
                    'Проверь подключение прокси и попробуй ещё раз'
                  }`,
              },
            ]);
            renderAgentMessages();
          } else {
            addAgentMessage({
              role: 'assistant',
              text: payload.text || 'Агент вернул пустой ответ.',
              findings: Array.isArray(payload.findings) ? payload.findings : [],
            }, requestKind);
          }

          syncAgentViewState();
          requestNextPendingAgentReport();
        }

        function createInitialAgentLoadingMessage(text, requestKind) {
          return {
            id: `agent-loading-${requestKind}`,
            role: 'assistant',
            variant: 'loading',
            text,
          };
        }

        function getAgentMessages(requestKind) {
          if (requestKind === 'generation') {
            return agentGenerationMessages;
          }
          if (requestKind === 'texts') {
            return agentTextMessages;
          }
          return requestKind === 'question'
            ? agentDialogueMessages
            : agentReportMessages;
        }

        function setAgentMessages(requestKind, messages) {
          if (requestKind === 'generation') {
            agentGenerationMessages = messages;
          } else if (requestKind === 'texts') {
            agentTextMessages = messages;
          } else if (requestKind === 'question') {
            agentDialogueMessages = messages;
          } else {
            agentReportMessages = messages;
          }
        }

        function getVisibleAgentRequestKind() {
          if (agentDialogueOpen) {
            return agentDialogueMode === 'generation'
              ? 'generation'
              : 'question';
          }
          return activeApolloView === 'texts' ? 'texts' : 'report';
        }

        function addAgentMessage(message, requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          agentMessageSequence += 1;
          getAgentMessages(targetKind).push({
            id: `agent-message-${agentMessageSequence}`,
            ...message,
          });
          renderAgentMessages();
        }

        function replaceAgentLoadingMessage(message, requestKind) {
          removeAgentLoadingMessage(requestKind);
          addAgentMessage(message, requestKind);
        }

        function removeAgentLoadingMessage(requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          setAgentMessages(targetKind, getAgentMessages(targetKind).filter(
            (message) => message.variant !== 'loading',
          ));
          renderAgentMessages();
        }

        function renderAgentMessages() {
          if (!agentConversationInner) {
            return;
          }
          closeAgentActionMenu();

          const visibleMessages =
            !agentDialogueOpen && activeApolloView === 'audit'
              ? []
              : getAgentMessages(getVisibleAgentRequestKind());
          const hasSystemState = hasAgentSystemState();
          const hasLoadingState =
            visibleMessages.length === 1 &&
            visibleMessages[0]?.variant === 'loading';
          agentConversationInner.classList.toggle(
            'system-state-visible',
            hasSystemState,
          );
          agentConversationInner.classList.toggle(
            'loading-state-visible',
            hasLoadingState,
          );
          agentConversationInner.classList.toggle(
            'report-visible',
            !agentDialogueOpen && activeApolloView !== 'audit' && !hasSystemState,
          );
          agentConversationInner.innerHTML = visibleMessages
            .map((message) => renderAgentMessage(message))
            .join('');

          if (agentConversation) {
            agentConversation.scrollTop = agentConversation.scrollHeight;
          }
        }

        function hasAgentSystemState(requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          const messages = getAgentMessages(targetKind);
          return messages.length === 1 && messages[0]?.role === 'error';
        }

        function updateAgentRetryTimer() {
          const visibleRequestKind = getVisibleAgentRequestKind();
          const visibleReportMeta = activeApolloView === 'report'
            ? patternReportMeta
            : activeApolloView === 'texts'
              ? textReportMeta
              : null;
          const shouldRetry =
            Boolean(visibleReportMeta) &&
            hasAgentSystemState(visibleRequestKind) &&
            !agentRequestInProgress;

          if (!shouldRetry) {
            if (agentRetryTimerId !== null) {
              clearInterval(agentRetryTimerId);
              agentRetryTimerId = null;
            }
            return;
          }

          if (agentRetryTimerId !== null) {
            return;
          }

          agentRetryTimerId = setInterval(() => {
            if (
              (activeApolloView === 'report' || activeApolloView === 'texts') &&
              hasAgentSystemState(getVisibleAgentRequestKind()) &&
              (activeApolloView === 'report' ? patternReportMeta : textReportMeta) &&
              !agentRequestInProgress
            ) {
              retryActiveAgentRequest();
            }
          }, 30000);
        }

        function renderAgentMessage(message) {
          if (message.role === 'user') {
            return `<article class="message-card user"><div class="user-msg"><div class="user-msg__stack"><div class="user-msg__line"><div class="user-msg__container">${buildMarkdownMessageMarkup(
              message.text || '',
            )}</div></div></div></div></article>`;
          }

          if (message.role === 'error') {
            const errorLines = String(message.text || '')
              .split('\n')
              .map((line) => line.trim())
              .filter(Boolean);
            const errorTitle = errorLines.shift() || 'Агент сейчас недоступен';
            const errorDetails =
              errorLines.join(' · ') ||
              'Проверь подключение прокси и попробуй ещё раз';
            return `<article class="message-card system-state"><div class="agent-system-state"><div class="agent-system-state__graphic" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 10C7.32843 10 8 10.6716 8 11.5C8 12.3284 7.32843 13 6.5 13C5.67157 13 5 12.3284 5 11.5C5 10.6716 5.67157 10 6.5 10Z" fill="currentColor"/><path d="M13.5 10C14.3284 10 15 10.6716 15 11.5C15 12.3284 14.3284 13 13.5 13C12.6716 13 12 12.3284 12 11.5C12 10.6716 12.6716 10 13.5 10Z" fill="currentColor"/><path d="M10 2C10.8284 2 11.5 2.67157 11.5 3.5C11.5 4.05495 11.198 4.5384 10.75 4.79785V6.9502H14.4512C16.1078 6.95041 17.4512 8.29347 17.4512 9.9502V15C17.4512 16.6567 16.1078 17.9998 14.4512 18H5.55078C3.89393 18 2.55078 16.6569 2.55078 15V9.9502C2.55078 8.29334 3.89393 6.9502 5.55078 6.9502H9.25V4.79785C8.802 4.5384 8.5 4.05495 8.5 3.5C8.5 2.67157 9.17157 2 10 2ZM5.55078 8.4502C4.72236 8.4502 4.05078 9.12177 4.05078 9.9502V15C4.05078 15.8284 4.72235 16.5 5.55078 16.5H14.4512C15.2794 16.4998 15.9512 15.8283 15.9512 15V9.9502C15.9512 9.1219 15.2794 8.45041 14.4512 8.4502H5.55078Z" fill="currentColor"/></svg></div><div class="agent-system-state__title">${escapeHtml(errorTitle)}</div><div class="agent-system-state__subtitle">${escapeHtml(errorDetails)}</div><button class="agent-system-state__retry" type="button" data-agent-retry-button>Попробовать ещё раз</button></div></article>`;
          }

          if (message.variant === 'loading') {
            const loadingText = message.text || 'Apollo думает';
            return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-actions loading"><span class="spinner" aria-hidden="true"></span><span>${escapeHtml(
              loadingText,
            )}</span></div></div></div></article>`;
          }

          return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-copy">${buildMarkdownMessageMarkup(
            message.text || '',
            message.findings,
          )}</div></div></div></article>`;
        }

        function syncAgentViewState() {
          const reportViewActive = activeApolloView !== 'audit';
          const agentViewVisible = reportViewActive || agentDialogueOpen;
          if (agentTableFab) {
            agentTableFab.classList.toggle('active', activeApolloView === 'audit');
            agentTableFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'audit' ? 'true' : 'false',
            );
          }
          if (agentReportFab) {
            agentReportFab.disabled = false;
            agentReportFab.classList.toggle(
              'active',
              activeApolloView === 'report',
            );
            agentReportFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'report' ? 'true' : 'false',
            );
          }
          if (agentChatFab) {
            agentChatFab.disabled = false;
            agentChatFab.classList.toggle(
              'active',
              activeApolloView === 'texts',
            );
            agentChatFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'texts' ? 'true' : 'false',
            );
          }
          if (agentChatOverlay) {
            agentChatOverlay.classList.toggle('visible', agentViewVisible);
            agentChatOverlay.classList.toggle(
              'report-visible',
              !agentDialogueOpen && reportViewActive,
            );
            agentChatOverlay.classList.toggle(
              'dialogue-visible',
              agentDialogueOpen,
            );
            agentChatOverlay.setAttribute(
              'aria-hidden',
              agentViewVisible ? 'false' : 'true',
            );
          }
          if (agentChatPanel) {
            agentChatPanel.setAttribute(
              'role',
              agentDialogueOpen ? 'dialog' : 'region',
            );
            agentChatPanel.setAttribute(
              'aria-label',
              agentDialogueOpen ? 'Чат с Apollo' : 'Apollo agent',
            );
            if (agentDialogueOpen) {
              agentChatPanel.setAttribute('aria-modal', 'true');
            } else {
              agentChatPanel.removeAttribute('aria-modal');
            }
          }
          if (agentChatLauncher) {
            agentChatLauncher.setAttribute(
              'aria-expanded',
              agentDialogueOpen ? 'true' : 'false',
            );
          }
          if (mainEl) {
            mainEl.classList.toggle('agent-active', reportViewActive);
          }
          if (workspaceEl) {
            workspaceEl.classList.toggle('agent-active', reportViewActive);
          }
          if (agentComposerInput) {
            const dialogueRequestInProgress = agentDialogueMode === 'generation'
              ? generationRequestInProgress
              : agentRequestInProgress;
            agentComposerInput.disabled = dialogueRequestInProgress;
            agentComposerInput.placeholder = agentDialogueMode === 'generation'
              ? 'Опишите макет'
              : 'Задай вопрос';
          }
          if (agentComposer) {
            if (agentDialogueOpen) {
              agentComposer.classList.remove('hidden');
            } else {
              agentComposer.classList.add('hidden');
            }
          }
          if (agentComposerSubmit) {
            const hasDraft = Boolean(agentComposerInput?.value?.trim());
            const canStopQuestion =
              agentRequestInProgress && agentActiveRequestKind === 'question';
            const canStopGeneration =
              generationRequestInProgress && agentDialogueMode === 'generation';
            const canStopDialogue = canStopQuestion || canStopGeneration;
            agentComposerSubmit.classList.toggle('is-stop', canStopDialogue);
            agentComposerSubmit.classList.toggle(
              'hidden',
              !canStopDialogue && !hasDraft,
            );
            agentComposerSubmit.disabled =
              (agentRequestInProgress || generationRequestInProgress)
                ? !canStopDialogue
                : !hasDraft;
            agentComposerSubmit.setAttribute(
              'aria-label',
              canStopDialogue
                ? 'Остановить'
                : agentDialogueMode === 'generation'
                  ? 'Создать макет'
                  : 'Отправить агенту',
            );
          }
          syncAgentDialogueModeControl();
          syncAgentSourceControl();
          updateAgentRetryTimer();
        }

        function buildMarkdownMessageMarkup(source, findings) {
          const normalized = normalizeMarkdownSource(source);
          if (!normalized) {
            return '';
          }
          const parsedBlocks = parseMarkdownBlocks(normalized);
          const structuredBlocks = !agentDialogueOpen && activeApolloView === 'report'
            ? mergePatternReportTables(parsedBlocks, findings)
            : groupCollapsibleMarkdownSections(parsedBlocks);
          const blocks = structuredBlocks.map(normalizeAgentReportBlock);
          attachAgentFindingRows(blocks, findings);
          return `<div class="markdown-root">${blocks
            .map((block) => renderMarkdownBlock(
              block,
              block.findingRows || [],
            ))
            .join('')}</div>`;
        }

        function mergePatternReportTables(blocks, findings) {
          const output = [];
          const rowsByScope = {
            general: [],
            'page-specific': [],
          };
          let insertAt = null;
          let allowedSection = false;
          let currentScope = 'general';

          for (const block of blocks) {
            if (block?.type === 'heading') {
              const title = String(block.text || '').trim();
              currentScope = getPatternReportScope(title) || currentScope;
              allowedSection = /^Допустимые кастомизации(?:\s*·\s*\d+)?$/i.test(
                title,
              );
              if (isPatternReportGroupHeading(title)) {
                continue;
              }
            }

            if (
              block?.type === 'paragraph' &&
              /^Не выполнялись:\s*тип страницы не выбран\.?$/i.test(
                String(block.text || '').trim(),
              )
            ) {
              continue;
            }

            if (isAgentFindingTable(block)) {
              if (insertAt === null) insertAt = output.length;
              const rows = normalizeAgentFindingRows(block);
              rowsByScope[currentScope].push(...rows);
              allowedSection = false;
              continue;
            }

            if (allowedSection && block?.type === 'table') {
              if (insertAt === null) insertAt = output.length;
              rowsByScope[currentScope].push(...normalizeAllowedPatternRows(block));
              allowedSection = false;
              continue;
            }

            output.push(block);
          }

          if (insertAt !== null) {
            Object.values(rowsByScope).forEach((rows) => {
              rows.sort(
                (left, right) =>
                  getMarkdownStatusSortOrder(left[0]) -
                  getMarkdownStatusSortOrder(right[0]),
              );
            });
            const createTable = (scope) => ({
              type: 'table',
              patternScope: scope,
              headers: ['Статус', 'Причина', 'Ожидание', 'Действие'],
              rows: rowsByScope[scope],
            });
            output.splice(insertAt, 0, {
              type: 'tabs',
              tabs: [
                {
                  id: 'base',
                  label: 'База',
                  blocks: [createTable('general')],
                },
                {
                  id: 'section',
                  label: 'Раздел',
                  blocks: [createTable('page-specific')],
                },
              ],
            });
          }

          return output;
        }

        function isPatternReportGroupHeading(value) {
          return /^(?:Общие(?:\s+компонентные)?\s+паттерны|Специализированные паттерны страницы|Паттерны страницы|Подтвержд[её]нные нарушения|Предположения агента|Допустимые кастомизации)(?:\s*·\s*\d+)?$/i.test(
            String(value || '').trim(),
          );
        }

        function getPatternReportScope(value) {
          const title = String(value || '')
            .trim()
            .replace(/\s*·\s*\d+\s*$/, '')
            .toLowerCase();
          if (
            /^специализированные паттерны страницы/.test(title) ||
            /^паттерны страницы/.test(title) ||
            /^раздел/.test(title)
          ) {
            return 'page-specific';
          }
          if (
            /^общие(?:\s+компонентные)?\s+паттерны/.test(title) ||
            /^компонентные паттерны/.test(title) ||
            /^база/.test(title)
          ) {
            return 'general';
          }
          return null;
        }

        function normalizeAgentReportBlock(block) {
          if (block?.type === 'tabs') {
            return {
              ...block,
              tabs: (block.tabs || []).map((tab) => ({
                ...tab,
                blocks: (tab.blocks || []).map(normalizeAgentReportBlock),
              })),
            };
          }
          if (block?.type === 'collapsible') {
            return {
              ...block,
              children: (block.children || []).map(normalizeAgentReportBlock),
            };
          }
          if (!isAgentFindingTable(block)) {
            return block;
          }
          return {
            ...block,
            headers: ['Статус', 'Причина', 'Ожидание', 'Действие'],
            rows: normalizeAgentFindingRows(block),
          };
        }

        function normalizeAgentFindingRows(block) {
          const headers = block.headers.map((header) =>
            String(header || '').trim().toLowerCase(),
          );
          const indexOf = (...labels) => headers.findIndex((header) =>
            labels.some((label) => header === label),
          );
          const statusIndex = indexOf('приоритет', 'статус');
          const reasonIndex = indexOf('нарушение', 'причина ошибки', 'причина');
          const factIndex = indexOf('факт');
          const expectationIndex = indexOf('ожидание');
          const sourceIndex = indexOf('источник');
          const actionIndex = indexOf('исправление', 'действие');
          return block.rows.map((row) => {
            const reason = reasonIndex >= 0 ? row[reasonIndex] || '' : '';
            const fact = factIndex >= 0 ? row[factIndex] || '' : '';
            return [
              statusIndex >= 0 ? row[statusIndex] || '' : '',
              [reason, fact].filter(Boolean).join('<br>'),
              [
                expectationIndex >= 0 ? row[expectationIndex] || '' : '',
                sourceIndex >= 0
                  ? getCompactAgentSource(row[sourceIndex] || '')
                  : '',
              ].filter(Boolean).join('<br>'),
              actionIndex >= 0 ? row[actionIndex] || '' : '',
            ];
          });
        }

        function getCompactAgentSource(value) {
          const source = String(value || '').trim();
          if (!source) {
            return '';
          }
          const linkMatch = source.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
          if (linkMatch) {
            return `[${getCompactAgentSourcePath(linkMatch[1])}](${linkMatch[2]})`;
          }
          return getCompactAgentSourcePath(source);
        }

        function getCompactAgentSourcePath(value) {
          const path = String(value || '')
            .split(/\s+—\s+/)[0]
            .trim()
            .replace(/\\/g, '/');
          if (!path.includes('/')) {
            return path;
          }
          return path.split('/').filter(Boolean).slice(-2).join('/');
        }

        function normalizeAllowedPatternRows(block) {
          const headers = block.headers.map((header) =>
            String(header || '').trim().toLowerCase(),
          );
          const indexOf = (...labels) => headers.findIndex((header) =>
            labels.some((label) => header === label),
          );
          const titleIndex = indexOf('кастомизация', 'изменение');
          const factIndex = indexOf('факт');
          const rationaleIndex = indexOf('обоснование', 'ожидание');
          const sourceIndex = indexOf('источник');
          return block.rows.map((row) => [
            'Ок',
            [
              titleIndex >= 0 ? row[titleIndex] || '' : '',
              factIndex >= 0 ? row[factIndex] || '' : '',
            ].filter(Boolean).join('<br>'),
            [
              rationaleIndex >= 0 ? row[rationaleIndex] || '' : '',
              sourceIndex >= 0
                ? getCompactAgentSource(row[sourceIndex] || '')
                : '',
            ].filter(Boolean).join('<br>'),
            '',
          ]);
        }

        function getMarkdownStatusSortOrder(value) {
          const type = getMarkdownStatusType(value);
          if (type === 'error') return 0;
          if (type === 'success') return 2;
          return 1;
        }

        function attachAgentFindingRows(blocks, findings) {
          const validFindings = Array.isArray(findings)
            ? findings.filter(
                (finding) =>
                  finding &&
                  typeof finding.nodeId === 'string' &&
                  finding.nodeId,
              )
            : [];
          const hasPatternScopes = validFindings.some(
            (finding) =>
              finding.patternScope === 'general' ||
              finding.patternScope === 'page-specific',
          );
          const findingGroups = getAgentFindingGroups(validFindings);
          const findingTables = collectAgentFindingTables(blocks);
          const scopedTables = findingTables.filter(
            (table) =>
              table.patternScope === 'general' ||
              table.patternScope === 'page-specific',
          );
          if (scopedTables.length) {
            scopedTables.forEach((table) => {
              const scope = table.patternScope;
              const tableFindings = sortAgentFindingsByPriority(
                validFindings.filter((finding) => {
                  const findingScope = finding.patternScope === 'page-specific'
                    ? 'page-specific'
                    : 'general';
                  return findingScope === scope;
                }),
              );
              table.findingRows = tableFindings.slice(0, table.rows.length);
            });
            return;
          }
          if (findingTables.length === 1) {
            const tableBlock = findingTables[0];
            const tableFindings = hasPatternScopes
              ? sortAgentFindingsByPriority(validFindings)
              : validFindings;
            tableBlock.findingRows = tableFindings.slice(
              0,
              tableBlock.rows.length,
            );
            return;
          }
          findingTables
            .slice(-findingGroups.length)
            .forEach((table, index) => {
              table.findingRows = findingGroups[index] || [];
            });
        }

        function collectAgentFindingTables(blocks, tables = []) {
          (blocks || []).forEach((block) => {
            if (isAgentFindingTable(block)) {
              tables.push(block);
              return;
            }
            if (block?.type === 'tabs') {
              (block.tabs || []).forEach((tab) =>
                collectAgentFindingTables(tab.blocks || [], tables),
              );
              return;
            }
            if (block?.type === 'collapsible') {
              collectAgentFindingTables(block.children || [], tables);
            }
          });
          return tables;
        }

        function groupPatternMarkdownTabs(blocks) {
          const markers = [];
          blocks.forEach((block, index) => {
            const meta = getPatternTabMeta(block);
            if (meta) {
              markers.push({ index, depth: block.depth, ...meta });
            }
          });
          const distinctTabIds = new Set(markers.map((marker) => marker.id));
          if (markers.length < 2 || distinctTabIds.size < 2) {
            return blocks;
          }

          const tabs = markers.map((marker, markerIndex) => {
            const nextMarker = markers[markerIndex + 1];
            let end = nextMarker ? nextMarker.index : blocks.length;
            if (!nextMarker) {
              for (let index = marker.index + 1; index < blocks.length; index += 1) {
                const candidate = blocks[index];
                if (
                  candidate?.type === 'heading' &&
                  candidate.depth <= marker.depth
                ) {
                  end = index;
                  break;
                }
              }
            }
            return {
              id: marker.id,
              label: marker.label,
              blocks: blocks.slice(marker.index + 1, end),
              end,
            };
          });
          const groupEnd = tabs[tabs.length - 1].end;
          return [
            ...blocks.slice(0, markers[0].index),
            { type: 'tabs', tabs },
            ...blocks.slice(groupEnd),
          ];
        }

        function getPatternTabMeta(block) {
          if (block?.type !== 'heading') {
            return null;
          }
          const title = String(block.text || '')
            .trim()
            .replace(/\s*·\s*\d+\s*$/, '')
            .toLowerCase();
          if (/^общие(?:\s+компонентные)?\s+паттерны/.test(title)) {
            return { id: 'general', label: 'Общие паттерны' };
          }
          if (
            /^компонентные(?:\s+паттерны)?/.test(title) ||
            /^паттерны страницы/.test(title)
          ) {
            return { id: 'component', label: 'Паттерны страницы' };
          }
          return null;
        }

        function groupCollapsibleMarkdownSections(blocks) {
          const grouped = [];
          let index = 0;
          while (index < blocks.length) {
            const block = blocks[index];
            const isAllowedSection =
              block?.type === 'heading' &&
              block.depth === 2 &&
              /^Допустимые кастомизации(?:\s*·\s*\d+)?$/i.test(
                String(block.text || '').trim(),
              );
            if (!isAllowedSection) {
              grouped.push(block);
              index += 1;
              continue;
            }
            const children = [];
            index += 1;
            while (index < blocks.length) {
              const candidate = blocks[index];
              if (candidate?.type === 'heading' && candidate.depth <= 2) {
                break;
              }
              children.push(candidate);
              index += 1;
            }
            grouped.push({
              type: 'collapsible',
              title: block.text,
              children,
            });
          }
          return grouped;
        }

        function getAgentFindingGroups(findings) {
          if (!Array.isArray(findings)) {
            return [];
          }
          const validFindings = findings.filter(
            (finding) => finding && typeof finding.nodeId === 'string' && finding.nodeId,
          );
          const hasPatternScopes = validFindings.some(
            (finding) =>
              finding.patternScope === 'general' ||
              finding.patternScope === 'page-specific',
          );
          if (hasPatternScopes) {
            return ['general', 'page-specific']
              .map((scope) =>
                sortAgentFindingsByPriority(
                  validFindings.filter(
                    (finding) => finding.patternScope === scope,
                  ),
                ),
              )
              .filter((group) => group.length > 0);
          }
          const confirmed = validFindings.filter(
            (finding) => finding.verdict === 'confirmed',
          );
          const assumptions = validFindings.filter(
            (finding) => finding.verdict === 'assumption',
          );
          return [confirmed, assumptions].filter((group) => group.length > 0);
        }

        function sortAgentFindingsByPriority(findings) {
          const priorityOrder = {
            error: 0,
            warning: 1,
            human_review: 1,
            allowed: 2,
          };
          return findings.slice().sort(
            (left, right) =>
              (priorityOrder[left?.priority] ?? 3) -
              (priorityOrder[right?.priority] ?? 3),
          );
        }

        function isAgentFindingTable(block) {
          if (block?.type !== 'table' || !Array.isArray(block.headers)) {
            return false;
          }
          const headers = block.headers.map((header) => String(header).trim());
          const hasStatus =
            headers.includes('Приоритет') || headers.includes('Статус');
          const hasReason =
            headers.includes('Нарушение') ||
            headers.includes('Причина ошибки') ||
            headers.includes('Причина');
          return hasStatus && hasReason;
        }

        function parseMarkdownBlocks(source) {
          const lines = source.split('\n');
          const blocks = [];
          let index = 0;

          while (index < lines.length) {
            const line = lines[index];
            const trimmed = line.trim();
            const normalizedTrimmed = normalizeMarkdownLine(trimmed);

            if (!normalizedTrimmed) {
              index += 1;
              continue;
            }

            if (isCodeFence(normalizedTrimmed)) {
              const code = [];
              index += 1;
              while (
                index < lines.length &&
                !isCodeFence(normalizeMarkdownLine(lines[index].trim()))
              ) {
                code.push(lines[index]);
                index += 1;
              }
              if (index < lines.length) {
                index += 1;
              }
              blocks.push({ type: 'code', code: code.join('\n') });
              continue;
            }

            if (isMarkdownTableStart(lines, index)) {
              const tableLines = [lines[index], lines[index + 1]];
              index += 2;
              while (index < lines.length && isMarkdownTableRow(lines[index])) {
                tableLines.push(lines[index]);
                index += 1;
              }
              blocks.push(parseMarkdownTable(tableLines));
              continue;
            }

            const heading = normalizedTrimmed.match(/^(#{1,6})\s*(.+)$/);
            if (heading) {
              blocks.push({
                type: 'heading',
                depth: heading[1].length,
                text: heading[2].trim(),
              });
              index += 1;
              continue;
            }

            if (/^-{3,}$/.test(normalizedTrimmed)) {
              blocks.push({ type: 'divider' });
              index += 1;
              continue;
            }

            if (/^>\s?/.test(normalizedTrimmed)) {
              const quoteLines = [];
              while (index < lines.length) {
                const quoteLine = normalizeMarkdownLine(lines[index].trim());
                if (!/^>\s?/.test(quoteLine)) {
                  break;
                }
                quoteLines.push(quoteLine.replace(/^>\s?/, ''));
                index += 1;
              }
              blocks.push({ type: 'quote', text: quoteLines.join('\n') });
              continue;
            }

            if (
              isStandaloneQuotedLine(normalizedTrimmed) &&
              shouldTreatAsQuoteAfter(blocks)
            ) {
              blocks.push({
                type: 'quote',
                text: unwrapStandaloneQuote(normalizedTrimmed),
              });
              index += 1;
              continue;
            }

            const listMeta = getListMeta(normalizedTrimmed);
            if (listMeta) {
              const items = [];
              const ordered = listMeta.ordered;
              while (index < lines.length) {
                const currentMeta = getListMeta(
                  normalizeMarkdownLine(lines[index].trim()),
                );
                if (!currentMeta || currentMeta.ordered !== ordered) {
                  break;
                }
                items.push(currentMeta.content);
                index += 1;
              }
              blocks.push({ type: 'list', ordered, items });
              continue;
            }

            const paragraph = [normalizedTrimmed];
            index += 1;
            while (index < lines.length) {
              const next = normalizeMarkdownLine(lines[index].trim());
              if (
                !next ||
                isCodeFence(next) ||
                /^(#{1,6})\s*/.test(next) ||
                isListLine(next) ||
                /^\d+[.)]\s+/.test(next) ||
                /^>\s?/.test(next) ||
                isMarkdownTableStart(lines, index)
              ) {
                break;
              }
              paragraph.push(next);
              index += 1;
            }
            blocks.push({ type: 'paragraph', text: paragraph.join(' ') });
          }

          return blocks;
        }

        function renderMarkdownBlock(block, findingRows) {
          if (block.type === 'tabs') {
            const tabs = block.tabs || [];
            const tabButtons = tabs
              .map(
                (tab, index) =>
                  `<button type="button" class="md-tabs__tab" role="tab" aria-selected="${index === 0 ? 'true' : 'false'}" tabindex="${index === 0 ? '0' : '-1'}" data-md-tab-index="${index}">${escapeHtml(tab.label)}</button>`,
              )
              .join('');
            const tabPanels = tabs
              .map((tab, index) => {
                const content = tab.blocks
                  .map((child) =>
                    renderMarkdownBlock(child, child.findingRows || []),
                  )
                  .join('');
                return `<div class="md-tabs__panel" role="tabpanel" data-md-tab-panel="${index}"${index === 0 ? '' : ' hidden'}>${content}</div>`;
              })
              .join('');
            return `<div class="md-block md-tabs" data-md-tabs><div class="md-tabs__list" role="tablist">${tabButtons}</div>${tabPanels}</div>`;
          }
          if (block.type === 'collapsible') {
            const content = block.children
              .map((child) =>
                renderMarkdownBlock(child, child.findingRows || []),
              )
              .join('');
            return `<details class="md-block md-collapsible"><summary class="md-collapsible__summary">${renderInlineMarkdown(
              block.title,
            )}</summary><div class="md-collapsible__content">${content}</div></details>`;
          }
          if (block.type === 'heading') {
            return `<div class="md-block md-block--h${block.depth}"><div class="md-h${block.depth}">${renderInlineMarkdown(
              block.text,
            )}</div></div>`;
          }
          if (block.type === 'paragraph') {
            return `<div class="md-block md-block--paragraph"><p class="md-p">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'quote') {
            return `<div class="md-block md-block--quote"><p class="md-quote">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'divider') {
            return '<div class="md-block md-block--divider"><div class="md-divider"></div></div>';
          }
          if (block.type === 'code') {
            return `<div class="md-block md-block--code"><pre class="md-pre"><code>${escapeHtml(
              block.code,
            )}</code></pre></div>`;
          }
          if (block.type === 'table') {
            const tableHeaders = getMarkdownTableHeaders(block);
            const head = tableHeaders
              .map((header) => `<th class="md-th">${renderInlineMarkdown(header)}</th>`)
              .join('');
            const body = block.rows
              .map(
                (row, rowIndex) => {
                  const finding = findingRows[rowIndex] || null;
                  const resetActions = finding
                    ? buildAgentFindingResetActions(finding)
                    : [];
                  const interactiveAttributes = finding
                    ? ` class="md-tr md-tr--interactive" data-node-id="${escapeHtml(finding.nodeId)}" tabindex="0" role="button" aria-label="Перейти к ${escapeHtml(finding.title || 'элементу')}"`
                    : ' class="md-tr"';
                  const cells = row.map((cell, cellIndex) => {
                    const isLastCell = cellIndex === row.length - 1;
                    const renderedCell = renderMarkdownTableCell(
                      cell,
                      cellIndex,
                      tableHeaders,
                    );
                    if (
                      isLastCell &&
                      resetActions.length &&
                      typeof finding?.id === 'string'
                    ) {
                      const actionLabel = resetActions.length > 1
                        ? 'Выбрать вариант'
                        : resetActions[0].label || 'Применить';
                      return `<td class="md-td"><button type="button" class="md-action-cell" data-agent-finding-action="${escapeHtml(finding.id)}">${renderedCell}<span class="md-action-cell__label">${escapeHtml(actionLabel)}</span></button></td>`;
                    }
                    return `<td class="md-td">${renderedCell}</td>`;
                  });
                  return `<tr${interactiveAttributes}>${cells.join('')}</tr>`;
                },
              )
              .join('');
            return `<div class="md-block md-block--table"><div class="md-table-wrap"><div class="md-table-scroll"><table class="md-table"><thead><tr class="md-tr">${head}</tr></thead><tbody>${body}</tbody></table></div></div></div>`;
          }

          const items = block.items
            .map((item, index) => {
              const marker = block.ordered ? `${index + 1}.` : '–';
              const markerClass = block.ordered
                ? 'md-list-marker numbered'
                : 'md-list-marker';
              return `<div class="md-list-item"><div class="${markerClass}">${escapeHtml(
                marker,
              )}</div><div class="md-list-content">${renderInlineMarkdown(item)}</div></div>`;
            })
            .join('');
          return `<div class="md-block md-block--list"><div class="md-list">${items}</div></div>`;
        }

        function renderMarkdownTableCell(cell, cellIndex, headers) {
          const header = String(headers?.[cellIndex] || '').trim();
          if (cellIndex === 0 && (header === 'Статус' || header === 'Приоритет')) {
            const statusType = getMarkdownStatusType(cell);
            const statusLabel = statusType === 'error'
              ? 'Ошибка'
              : statusType === 'success'
                ? 'Ок'
                : 'Зови ДС';
            return `<span class="md-status md-status--${statusType}">${statusLabel}</span>`;
          }
          if (
            header === 'Причина' ||
            header === 'Причина ошибки' ||
            header === 'Ожидание'
          ) {
            return renderStackedMarkdownTableCell(cell);
          }
          return renderInlineMarkdown(cell);
        }

        function renderStackedMarkdownTableCell(value) {
          const lines = String(value || '')
            .split(/<br\s*\/?>/i)
            .map((line) => line.trim())
            .filter(Boolean);
          if (lines.length < 2) {
            return renderInlineMarkdown(lines[0] || '');
          }
          const [primary, ...secondary] = lines;
          return `<span class="md-cell-stack"><span class="md-cell-primary">${renderInlineMarkdown(primary)}</span><span class="md-cell-secondary">${secondary.map(renderInlineMarkdown).join('<br>')}</span></span>`;
        }

        function getMarkdownTableHeaders(block) {
          if (isAgentFindingTable(block)) {
            return ['Статус', 'Причина', 'Ожидание', 'Действие'];
          }
          return block.headers;
        }

        function getMarkdownStatusType(value) {
          const normalized = String(value || '').trim().toLowerCase();
          if (/^ок$|allowed|допуст|success|разреш[её]н/.test(normalized)) {
            return 'success';
          }
          if (
            /warning|предупреж|human|manual|review|провер|зови\s+дс|требу.*подтверж|assumption/.test(
              normalized,
            )
          ) {
            return 'warning';
          }
          if (/ошиб|error|critical|критич|confirmed|подтвержд[её]н/.test(normalized)) {
            return 'error';
          }
          return 'warning';
        }

        function activateMarkdownTab(tab) {
          const root = tab.closest('[data-md-tabs]');
          if (!root) {
            return;
          }
          const targetIndex = tab.getAttribute('data-md-tab-index');
          const tabs = Array.from(root.querySelectorAll('[data-md-tab-index]'))
            .filter((candidate) => candidate.closest('[data-md-tabs]') === root);
          const panels = Array.from(root.querySelectorAll('[data-md-tab-panel]'))
            .filter((candidate) => candidate.closest('[data-md-tabs]') === root);
          tabs.forEach((candidate) => {
            const active =
              candidate.getAttribute('data-md-tab-index') === targetIndex;
            candidate.setAttribute('aria-selected', active ? 'true' : 'false');
            candidate.setAttribute('tabindex', active ? '0' : '-1');
          });
          panels.forEach((panel) => {
            panel.hidden =
              panel.getAttribute('data-md-tab-panel') !== targetIndex;
          });
        }

        function moveMarkdownTabFocus(tab, key) {
          const root = tab.closest('[data-md-tabs]');
          if (!root) {
            return;
          }
          const tabs = Array.from(root.querySelectorAll('[data-md-tab-index]'))
            .filter((candidate) => candidate.closest('[data-md-tabs]') === root);
          const currentIndex = tabs.indexOf(tab);
          if (currentIndex < 0 || tabs.length === 0) {
            return;
          }
          let nextIndex = currentIndex;
          if (key === 'Home') {
            nextIndex = 0;
          } else if (key === 'End') {
            nextIndex = tabs.length - 1;
          } else if (key === 'ArrowLeft') {
            nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
          } else if (key === 'ArrowRight') {
            nextIndex = (currentIndex + 1) % tabs.length;
          }
          const nextTab = tabs[nextIndex];
          activateMarkdownTab(nextTab);
          nextTab.focus();
        }

        function renderInlineMarkdown(source) {
          const pattern =
            /(\[[^\]]+\]\([^)]+\)|`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|<br\s*\/?>)/gi;
          let cursor = 0;
          let html = '';
          pattern.lastIndex = 0;
          let match = pattern.exec(source);
          while (match) {
            if (match.index > cursor) {
              html += renderPlainTextWithAutolinks(source.slice(cursor, match.index));
            }
            html += renderInlineToken(match[0]);
            cursor = match.index + match[0].length;
            match = pattern.exec(source);
          }
          if (cursor < source.length) {
            html += renderPlainTextWithAutolinks(source.slice(cursor));
          }
          return html;
        }

        function renderPlainTextWithAutolinks(source) {
          const urlPattern = /\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/gi;
          let cursor = 0;
          let html = '';
          let match = urlPattern.exec(source);
          while (match) {
            const url = match[0];
            if (match.index > cursor) {
              html += escapeHtml(source.slice(cursor, match.index));
            }
            const escapedUrl = escapeHtml(url);
            html += `<a class="md-link" href="${escapedUrl}" target="_blank" rel="noreferrer">${escapedUrl}</a>`;
            cursor = match.index + url.length;
            match = urlPattern.exec(source);
          }
          if (cursor < source.length) {
            html += escapeHtml(source.slice(cursor));
          }
          return html;
        }

        function renderInlineToken(token) {
          if (/^<br\s*\/?>$/i.test(token)) {
            return '<br class="md-line-break">';
          }
          const linkMatch = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
          if (linkMatch) {
            const href = escapeHtml(linkMatch[2]);
            return `<a class="md-link" href="${href}" target="_blank" rel="noreferrer">${renderInlineMarkdown(
              linkMatch[1],
            )}</a>`;
          }
          if (token.startsWith('`') && token.endsWith('`')) {
            return `<code class="md-code-inline">${escapeHtml(token.slice(1, -1))}</code>`;
          }
          if (token.startsWith('**') && token.endsWith('**')) {
            return `<strong class="md-strong">${renderInlineMarkdown(
              token.slice(2, -2),
            )}</strong>`;
          }
          if (token.startsWith('*') && token.endsWith('*')) {
            return `<em class="md-em">${renderInlineMarkdown(token.slice(1, -1))}</em>`;
          }
          return escapeHtml(token);
        }

        function isMarkdownTableStart(lines, index) {
          return (
            index + 1 < lines.length &&
            isMarkdownTableRow(lines[index]) &&
            isMarkdownTableSeparator(lines[index + 1])
          );
        }

        function isMarkdownTableRow(line) {
          const normalized = sanitizeMarkdownTableLine(line);
          return normalized.includes('|') && normalized.trim().startsWith('|');
        }

        function isMarkdownTableSeparator(line) {
          const cells = sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
          return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
        }

        function parseMarkdownTable(lines) {
          const headers = splitMarkdownTableRow(lines[0]);
          const rows = lines.slice(2).map((line) =>
            normalizeMarkdownTableCells(splitMarkdownTableRow(line), headers.length),
          );
          return { type: 'table', headers, rows };
        }

        function splitMarkdownTableRow(line) {
          return sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
        }

        function sanitizeMarkdownTableLine(line) {
          const trimmed = String(line || '').trim().replace(/\|\.\s*$/, '|');
          if (trimmed.startsWith('|') && !trimmed.endsWith('|')) {
            return `${trimmed} |`;
          }
          return trimmed;
        }

        function normalizeMarkdownTableCells(cells, count) {
          const normalized = cells.slice(0, count);
          while (normalized.length < count) {
            normalized.push('');
          }
          return normalized;
        }

        function getListMeta(line) {
          const orderedMatch = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
          if (orderedMatch) {
            return { ordered: true, content: orderedMatch[2].trim() };
          }
          const unorderedMatch = line.match(/^\s*[-*+–—•]\s+(.+)$/);
          if (unorderedMatch) {
            return { ordered: false, content: unorderedMatch[1].trim() };
          }
          return null;
        }

        function normalizeMarkdownSource(source) {
          return String(source || '')
            .replace(/\r\n?/g, '\n')
            .replace(/[“”]/g, '"')
            .replace(/[‘’]/g, "'")
            .replace(/^\uFEFF/, '')
            .trim();
        }

        function normalizeMarkdownLine(line) {
          return String(line || '')
            .replace(/\u00a0/g, ' ')
            .replace(/^`{3,}\s*$/g, '```')
            .replace(/^`{3,}\s*([A-Za-z0-9_-]+)\s*$/g, '```$1')
            .trim();
        }

        function isCodeFence(line) {
          return /^`{3,}(?:[A-Za-z0-9_-]+)?\s*$/.test(line);
        }

        function isListLine(line) {
          return Boolean(getListMeta(line));
        }

        function shouldTreatAsQuoteAfter(blocks) {
          const previous = blocks[blocks.length - 1];
          if (!previous) {
            return false;
          }
          const previousText = String(previous.text || '').toLowerCase();
          if (previous.type !== 'paragraph' && previous.type !== 'heading') {
            return false;
          }
          return /(^|\s)(правило|цитата|source quote|quote)[^.!?]*:\s*$/.test(
            previousText,
          );
        }

        function isStandaloneQuotedLine(line) {
          return (
            /^["'«„“][\s\S]+["'»“”]$/.test(line) ||
            /^"«[\s\S]+»"$/.test(line) ||
            /^«[\s\S]+»$/.test(line)
          );
        }

        function unwrapStandaloneQuote(line) {
          return String(line || '')
            .replace(/^["'«„“]\s*/, '')
            .replace(/\s*["'»“”]$/, '');
        }

        function escapeHtml(value) {
          return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function refreshScanButton() {
          syncChromeState();
        }

        function updateLoaderVisibility() {
          syncChromeState();
        }

        function handleCatalogFileLoaded(payload) {
          if (!payload?.name) return;
          showCatalogToast(payload.name);
        }

        function handleScanActionPress() {
          if (isScanning) {
            parent.postMessage({ pluginMessage: { type: 'cancel-scan' } }, '*');
            return;
          }

          if (!catalogsReady) return;

          actionPhase = 'scanning';
          setScanningState(true);

          window.requestAnimationFrame(() => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'scan-selection',
                  payload: {
                    channelId: currentChannelId,
                    pickerLabel: currentPickerLabel,
                    pageType: currentPageTypeId,
                    shellAuditEnabled,
                    experimentalContractV2Enabled,
                  },
                },
              },
              '*',
            );
          });
        }

        function handlePickerChange(nextPickerLabel) {
          if (typeof nextPickerLabel !== 'string') {
            return;
          }

          const normalizedPickerLabel = nextPickerLabel.trim();
          if (!normalizedPickerLabel) {
            return;
          }

          currentPickerLabel = normalizedPickerLabel;
          const activeVisibleTab = getVisibleTabs().find(
            (tab) => tab.id === currentTab,
          );
          if (!activeVisibleTab && getVisibleTabs()[0]) {
            currentTab = getVisibleTabs()[0].id;
          }
          syncChromeState();
          parent.postMessage(
            {
              pluginMessage: {
                type: 'prepare-catalog-channel',
                payload: { pickerLabel: normalizedPickerLabel },
              },
            },
            '*',
          );
        }

        function handlePageTypeChange(nextPageTypeId) {
          if (typeof nextPageTypeId !== 'string') {
            return;
          }

          const normalizedPageTypeId = nextPageTypeId.trim();
          if (!normalizedPageTypeId) {
            return;
          }

          currentPageTypeId = normalizedPageTypeId;
          syncChromeState();
        }

        function handleChannelChange(nextChannelId) {
          if (typeof nextChannelId !== 'string') {
            return;
          }

          const normalizedChannelId = nextChannelId.trim();
          if (!normalizedChannelId) {
            return;
          }

          currentChannelId = normalizedChannelId;
          syncChromeState();
        }

        function handleShellAuditToggle() {
          if (isScanning) {
            return;
          }

          shellAuditEnabled = !shellAuditEnabled;
          syncChromeState();
        }

        function handleShowExpectedToggle() {
          showExpectedCustomizations = !showExpectedCustomizations;
          renderTabs();
          renderList();
        }

        function handleHideCustomizationsToggle() {
          hideCustomizations = !hideCustomizations;
          const visibleTabs = getVisibleTabs();

          if (!visibleTabs.some((tab) => tab.id === currentTab)) {
            currentTab = visibleTabs[0]?.id ?? currentTab;
          }

          renderTabs();
          renderList();
        }
