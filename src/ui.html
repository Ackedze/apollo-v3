<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font:
          12px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #111;
        background: #eceff3;
      }
      .shell {
        position: relative;
        width: 800px;
        height: 860px;
        margin: 0 auto;
        background: #d46dfa;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .shell.compact {
        width: 400px;
      }

      .header {
        padding: 0;
        border-bottom: 0;
      }

      .results-pane {
        flex: 1;
        min-width: 0;
        max-height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #fff;
        padding: 4px;
        box-sizing: border-box;
      }
      #react-results {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: 263px 1fr;
        gap: 0;
        flex: 1;
        min-width: 0;
        min-height: 0;
        border-radius: 20px 20px 0 0;
        background: #fff;
        overflow: hidden;
      }
      .workspace.compact {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .workspace.agent-active {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .workspace.agent-active .sidebar {
        display: none;
      }
      .sidebar {
        width: 263px;
        padding: 4px;
        overflow-y: auto;
        max-height: 100%;
        box-sizing: border-box;
      }
      .workspace.compact .sidebar {
        width: 100%;
        padding-right: 4px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: #fff;
      }
      .main.agent-active .results-pane {
        display: none !important;
      }
      .workspace.compact .main {
        display: none;
      }
      .workspace.compact.agent-active .main,
      .workspace.agent-active .main {
        display: flex;
      }
      .placeholder {
        padding: 24px;
        text-align: center;
        color: #999;
      }
      #toast {
        position: absolute;
        inset: auto auto 16px 16px;
        z-index: 25;
        max-width: 231px;
        box-sizing: border-box;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #111827;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #toast.visible {
        opacity: 1;
      }
      .stats-delivery-status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 26;
        min-height: 32px;
        padding: 6px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(4, 4, 19, 0.14);
        border-radius: 999px;
        background: #fff;
        color: #040413;
        box-shadow: 0 6px 20px rgba(4, 4, 19, 0.14);
        font: inherit;
        cursor: default;
      }
      .stats-delivery-status[hidden] {
        display: none;
      }
      .stats-delivery-status[data-phase='uploading']::before {
        width: 12px;
        height: 12px;
        margin-right: 6px;
        border: 2px solid rgba(4, 4, 19, 0.18);
        border-top-color: #040413;
        border-radius: 50%;
        content: '';
        animation: spin 0.8s linear infinite;
      }
      .stats-delivery-status[data-phase='failed'] {
        border-color: rgba(239, 49, 36, 0.28);
        background: #fff0ef;
        color: #d52015;
        cursor: pointer;
      }
      .stats-delivery-status[data-phase='success'] {
        border-color: rgba(14, 157, 77, 0.22);
        background: #eefaf3;
        color: #087a3d;
      }
      .view-segmented-control {
        position: absolute;
        left: 50%;
        top: 16px;
        z-index: 12;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.12);
      }
      .view-segment {
        box-sizing: border-box;
        width: auto;
        height: 40px;
        min-width: 88px;
        min-height: 40px;
        padding: 4px 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 14px;
        line-height: 20px;
        letter-spacing: -0.08px;
        cursor: pointer;
        transition:
          background 0.16s ease,
          color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .view-segment.active {
        background: #000;
        color: #fff;
        box-shadow: inset 0 0 0 1px #000;
      }
      .view-segment:nth-child(1) {
        min-width: 118px;
      }
      .view-segment:nth-child(2) {
        min-width: 99px;
      }
      .view-segmented-control.compact {
        top: 16px;
      }
      .view-segmented-control.compact .view-segment {
        width: auto;
        height: 32px;
        min-width: 72px;
        min-height: 32px;
        padding: 2px 6px;
        font-size: 12px;
      }
      .view-segmented-control.compact .view-segment:nth-child(1) {
        min-width: 88px;
      }
      .view-segment:disabled {
        cursor: default;
        opacity: 0.48;
      }
      .agent-chat-overlay {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: none;
        overflow: hidden;
        border-radius: 16px 16px 0 0;
        background: #f5f5f5;
      }
      .agent-chat-overlay.visible {
        display: flex;
      }
      .agent-chat-overlay.dialogue-visible {
        position: fixed;
        inset: 0;
        z-index: 40;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 0;
        background: rgba(0, 0, 0, 0.6);
      }
      .agent-chat-overlay.report-visible,
      .agent-chat-overlay.report-visible .agent-chat-panel {
        background: #fff;
      }
      .agent-chat-overlay.report-visible .agent-chat-panel::before {
        background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0) 100%);
      }
      .agent-chat-panel {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
      }
      .agent-chat-panel::before {
        content: '';
        position: absolute;
        z-index: 1;
        top: 0;
        left: 0;
        width: min(100%, 376px);
        height: 48px;
        pointer-events: none;
        background: linear-gradient(180deg, #f5f5f5 0%, rgba(245, 245, 245, 0) 100%);
      }
      .agent-chat-overlay.dialogue-visible .agent-chat-panel {
        width: 100%;
        height: 100%;
        flex: 1 1 auto;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 20px;
        background: #fff;
        box-shadow:
          0 0 1px rgba(0, 0, 0, 0.04),
          0 4px 8px rgba(0, 0, 0, 0.04),
          0 12px 16px rgba(0, 0, 0, 0.04);
      }
      .agent-chat-overlay.dialogue-visible .agent-chat-panel::before {
        width: 100%;
        background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0) 100%);
      }
      .agent-chat-panel,
      .agent-chat-panel *,
      .agent-chat-panel *::before,
      .agent-chat-panel *::after {
        box-sizing: border-box;
      }
      .agent-conversation {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 8px 20px 20px;
      }
      .workspace.compact .agent-conversation {
        padding-right: 12px;
        padding-left: 12px;
      }
      .agent-chat-overlay.dialogue-visible .agent-conversation {
        padding: 120px 12px 16px;
      }
      .agent-chat-overlay.dialogue-visible.generation-mode .agent-conversation {
        padding-top: 72px;
      }
      .agent-conversation-inner {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-width: 0;
      }
      .agent-conversation-inner.report-visible {
        justify-content: flex-start;
        padding: 28px 4px 0;
      }
      .agent-conversation-inner.system-state-visible {
        align-items: center;
        justify-content: center;
      }
      .agent-conversation-inner.loading-state-visible {
        align-items: center;
        justify-content: center;
        padding-top: 0;
      }
      .agent-conversation-inner.loading-state-visible .message-card {
        width: auto;
      }
      .agent-conversation-inner.loading-state-visible .assistant-msg {
        padding: 0;
      }
      .agent-conversation-inner.loading-state-visible .assistant-actions.loading {
        flex-direction: column;
        gap: 16px;
        margin-top: 0;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
      }
      .agent-conversation-inner.loading-state-visible .spinner {
        width: 40px;
        height: 40px;
        border-width: 4px;
      }
      .message-card {
        width: 100%;
        min-width: 0;
      }
      .message-card.system-state {
        width: min(100%, 420px);
      }
      .agent-system-state {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .agent-system-state__graphic {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 28px;
        background: rgba(38, 55, 88, 0.06);
        color: rgba(3, 3, 6, 0.88);
      }
      .agent-system-state__graphic svg {
        width: 48px;
        height: 48px;
        display: block;
      }
      .agent-system-state__title {
        width: 100%;
        padding-bottom: 16px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 22px;
        line-height: 26px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .agent-system-state__subtitle {
        width: 100%;
        padding-bottom: 12px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 16px;
        line-height: 24px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .agent-system-state__retry {
        min-height: 40px;
        margin-top: 12px;
        padding: 8px 18px;
        border: 0;
        border-radius: 999px;
        background: #000;
        color: rgba(255, 255, 255, 0.94);
        font: inherit;
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        letter-spacing: 0;
        cursor: pointer;
      }
      .agent-system-state__retry:hover {
        background: rgba(3, 3, 6, 0.88);
      }
      .message-card.user {
        padding: 0;
      }
      .user-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .user-msg__stack {
        display: flex;
        width: 100%;
        min-width: 0;
        flex-direction: column;
        align-items: flex-end;
      }
      .user-msg__line {
        display: flex;
        width: 100%;
        min-width: 0;
        justify-content: flex-end;
      }
      .user-msg__container {
        width: fit-content;
        max-width: min(100%, 400px);
        min-width: 0;
        border-radius: 14px 14px 6px 14px;
        background: rgba(0, 0, 0, 0.08);
        padding: 12px 16px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 14px;
        line-height: 20px;
        overflow-wrap: anywhere;
      }
      .agent-chat-overlay.dialogue-visible .user-msg__container {
        font-size: 16px;
        line-height: 24px;
      }
      .assistant-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .assistant-msg__container {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        color: rgba(3, 3, 6, 0.88);
      }
      .assistant-msg__container.error {
        color: #c33d2f;
      }
      .assistant-copy {
        position: relative;
        width: 100%;
        max-width: 100%;
        color: inherit;
        font-size: 15px;
        line-height: 22px;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }
      .assistant-actions.loading {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: rgba(5, 8, 29, 0.45);
        font-size: 13px;
        line-height: 18px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(30, 43, 68, 0.16);
        border-top-color: rgba(3, 3, 6, 0.72);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .agent-composer {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        min-height: 56px;
        width: 100%;
        margin: 0;
        border-top: 1px solid #e7e7e7;
        border-radius: 0 0 16px 16px;
        background: #f5f5f5;
        overflow: hidden;
      }
      .agent-composer.hidden {
        display: none;
      }
      .agent-chat-overlay.dialogue-visible .agent-composer {
        width: calc(100% + 2px);
        height: 56px;
        min-height: 56px;
        flex: 0 0 56px;
        margin: 0 -1px -1px;
        border-radius: 0 0 20px 20px;
        background: #fff;
      }
      .agent-composer-input {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        min-height: 56px;
        max-height: 196px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 18px 52px 18px 20px;
        color: rgba(3, 3, 6, 0.88);
        font: inherit;
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 0;
        caret-color: rgba(3, 3, 6, 0.88);
      }
      .agent-composer-input::placeholder {
        color: rgba(5, 8, 29, 0.38);
        -webkit-text-fill-color: rgba(5, 8, 29, 0.38);
      }
      .agent-composer-input:disabled {
        color: rgba(5, 8, 29, 0.38);
        opacity: 1;
        -webkit-text-fill-color: rgba(5, 8, 29, 0.38);
      }
      .agent-chat-overlay.dialogue-visible .agent-composer-input {
        font-size: 16px;
        line-height: 20px;
      }
      .agent-chat-close {
        display: none;
      }
      .agent-chat-overlay.dialogue-visible .agent-chat-close {
        position: absolute;
        z-index: 3;
        top: 19px;
        right: 19px;
        width: 40px;
        height: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }
      .agent-chat-close__icon {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .agent-chat-close__icon svg {
        width: 12.6133px;
        height: 12.6133px;
        display: block;
      }
      .agent-source-control {
        display: none;
      }
      .agent-chat-overlay.dialogue-visible .agent-source-control {
        position: absolute;
        z-index: 3;
        top: 67px;
        left: 19px;
        height: 40px;
        padding: 4px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
      }
      .agent-chat-overlay.dialogue-visible.generation-mode .agent-source-control {
        display: none;
      }
      .agent-proxy-version {
        display: none;
      }
      .agent-chat-overlay.dialogue-visible.generation-mode .agent-proxy-version {
        position: absolute;
        z-index: 3;
        top: 67px;
        left: 19px;
        min-height: 32px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
        color: rgba(3, 3, 6, 0.64);
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
      }
      .agent-proxy-version::before {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #16a34a;
        content: '';
      }
      .agent-proxy-version.unavailable::before {
        background: rgba(3, 3, 6, 0.32);
      }
      .agent-dialogue-mode-control {
        display: none;
      }
      .agent-chat-overlay.dialogue-visible .agent-dialogue-mode-control {
        position: absolute;
        z-index: 3;
        top: 19px;
        left: 19px;
        height: 40px;
        padding: 4px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
      }
      .agent-dialogue-mode-control__option {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(3, 3, 6, 0.64);
        font: inherit;
        font-size: 13px;
        line-height: 18px;
        white-space: nowrap;
        cursor: pointer;
      }
      .agent-dialogue-mode-control__option:hover:not(.selected):not(:disabled) {
        background: rgba(0, 0, 0, 0.06);
        color: rgba(3, 3, 6, 0.88);
      }
      .agent-dialogue-mode-control__option.selected {
        background: #000;
        color: rgba(255, 255, 255, 0.94);
      }
      .agent-dialogue-mode-control__option:focus-visible {
        outline: 2px solid #196cff;
        outline-offset: 2px;
      }
      .agent-dialogue-mode-control__option:disabled {
        cursor: default;
        opacity: 0.48;
      }
      .agent-source-control__option {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(3, 3, 6, 0.64);
        font: inherit;
        font-size: 13px;
        line-height: 18px;
        white-space: nowrap;
        cursor: pointer;
      }
      .agent-source-control__option:hover:not(.selected):not(:disabled) {
        background: rgba(0, 0, 0, 0.06);
        color: rgba(3, 3, 6, 0.88);
      }
      .agent-source-control__option.selected {
        background: #000;
        color: rgba(255, 255, 255, 0.94);
      }
      .agent-source-control__option:focus-visible {
        outline: 2px solid #196cff;
        outline-offset: 2px;
      }
      .agent-source-control__option:disabled {
        cursor: default;
        opacity: 0.48;
      }
      .agent-chat-launcher {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        width: 40px;
        height: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        border-radius: 999px;
        background: #000;
        cursor: pointer;
      }
      .agent-chat-launcher__icon {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .agent-chat-launcher__icon svg {
        width: 16.666px;
        height: 16.334px;
        display: block;
      }
      .agent-input-addon {
        position: absolute;
        z-index: 3;
        right: 10px;
        bottom: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .agent-input-addon[disabled] {
        cursor: default;
        opacity: 0.36;
      }
      .agent-input-addon.hidden {
        display: none;
      }
      .agent-input-addon svg {
        display: block;
        width: 24px;
        height: 24px;
      }
      .agent-input-addon .agent-stop-icon,
      .agent-input-addon.is-stop .agent-send-icon {
        display: none;
      }
      .agent-input-addon.is-stop .agent-stop-icon {
        display: block;
      }
      .markdown-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
      }
      .md-block {
        width: 100%;
        min-width: 0;
      }
      .md-block--h1,
      .md-block--paragraph,
      .md-block--quote,
      .md-block--list {
        padding-bottom: 12px;
      }
      .md-block--h2 {
        padding: 24px 0 14px;
      }
      .md-block--h3,
      .md-block--h4,
      .md-block--h5,
      .md-block--h6,
      .md-block--divider,
      .md-block--code {
        padding: 14px 0 12px;
      }
      .md-block--table {
        padding: 12px 0;
      }
      .md-tabs {
        width: 100%;
        min-width: 0;
        padding: 0 0 12px;
      }
      .md-tabs__list {
        display: flex;
        align-items: flex-end;
        gap: 24px;
        width: 100%;
        min-width: 0;
        border-bottom: 1px solid rgba(15, 25, 55, 0.22);
      }
      .md-tabs__tab {
        min-height: 48px;
        margin-bottom: -1px;
        padding: 12px 0 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: rgba(4, 4, 19, 0.55);
        font: inherit;
        font-size: 16px;
        line-height: 24px;
        letter-spacing: 0;
        white-space: nowrap;
        cursor: pointer;
      }
      .md-tabs__tab[aria-selected='true'] {
        border-bottom-color: #000;
        color: rgba(3, 3, 6, 0.88);
      }
      .md-tabs__tab:focus-visible {
        outline: 2px solid rgba(5, 8, 29, 0.72);
        outline-offset: 2px;
      }
      .md-tabs__panel {
        width: 100%;
        min-width: 0;
      }
      .md-tabs__panel[hidden] {
        display: none;
      }
      .md-block:first-child {

    <script>
      (function () {
        let tabConfig = [];
        let leftSectionOrder = [
          'themization',
          'wrongChannel',
          'technical',
          'deprecated',
          'deprecatedStyles',
          'customStyles',
          '__divider_after_customStyles__',
          'update',
          'changes',
          'local',
          'detached',
          '__divider_after_detached__',
          'presets',
          'current',
        ];

        function initializeTabConfig(payload) {
          const definitions = Array.isArray(payload)
            ? payload
            : Array.isArray(payload?.definitions)
              ? payload.definitions
              : null;
          if (!definitions) return;

          if (Array.isArray(payload?.leftSectionOrder)) {
            leftSectionOrder = payload.leftSectionOrder.slice();
          }

          tabConfig = definitions
            .map((definition) => {
              const source = getTabSource(definition.id);
              if (!source) return null;
              return {
                ...definition,
                source,
              };
            })
            .filter(Boolean);
          renderTabs();
          const target =
            getVisibleTabs().find((tab) => tab.id === currentTab) ??
            getVisibleTabs()[0] ??
            tabConfig[0];
          if (target) {
            setActiveTab(target.id);
          }
        }

        function getValueFromPath(source, path) {
          if (!source || !Array.isArray(path)) return undefined;
          let current = source;
          for (const key of path) {
            if (!current || typeof current !== 'object') {
              return undefined;
            }
            current = current[key];
          }
          return current;
        }

        function resolveViewArray(path) {
          const primaryValue = getValueFromPath(
            currentResults?.visibleViews,
            path,
          );
          if (Array.isArray(primaryValue)) return primaryValue;
          return [];
        }

        function getTabSource(tabId) {
          switch (tabId) {
            case 'current':
              return () => resolveViewArray(['relevance', 'current']);
            case 'detached':
              return () => resolveViewArray(['detached']);
            case 'changes':
              return () => getVisibleCustomizationItems();
            case 'changesWip':
              return () => resolveViewArray(['changesWip']);
            case 'technical':
              return () => resolveViewArray(['relevance', 'technical']);
            case 'deprecated':
              return () => resolveViewArray(['relevance', 'deprecated']);
            case 'update':
              return () => resolveViewArray(['relevance', 'update']);
            case 'themization':
              return () => resolveViewArray(['themization']);
            case 'wrongChannel':
              return () => resolveViewArray(['wrongChannel']);
            case 'local':
              return () => resolveViewArray(['local']);
            case 'deprecatedStyles':
              return () => resolveViewArray(['deprecatedStyles']);
            case 'customStyles':
              return () => resolveViewArray(['customStyles']);
            case 'presets':
              return () => resolveViewArray(['presets']);
            default:
              return () => [];
          }
        }

        let currentTab = 'current';
        let currentResults = null;
        let isScanning = false;
        let catalogsReady = false;
        let catalogsLoading = true;
        let actionPhase = 'catalog-loading';
        let scanCompleted = false;
        let isCompact = false;
        let currentChannelId = 'b2b';
        let currentPickerLabel = 'Desktop';
        let currentPageTypeId = null;
        let shellAuditEnabled = false;
        let showExpectedCustomizations = true;
        let hideCustomizations = false;
        let experimentalContractV2Enabled = false;
        let agentReportMeta = null;
        let patternReportMeta = null;
        let textReportMeta = null;
        let activeApolloView = 'audit';
        let agentDialogueOpen = false;
        let agentDialogueMode = 'question';
        let agentDialogueSource = 'langflow';
        let agentRequestInProgress = false;
        let agentActiveRequestId = null;
        let agentActiveRequestKind = null;
        let agentRequestedPatternReportId = null;
        let agentRequestedTextReportId = null;
        let agentReportMessages = [];
        let agentTextMessages = [];
        let agentDialogueMessages = [];
        let agentGenerationMessages = [{
          id: 'apollo-generation-intro',
          role: 'assistant',
          text: 'Опишите макет. Агент прочитает подходящие паттерны и рецепты ds-ai-hub. Если данных для решения недостаточно, он задаст уточняющий вопрос.',
        }];
        let agentLastQuestion = '';
        let agentLastGenerationPrompt = '';
        let generationRequestInProgress = false;
        let generationActiveRequestId = null;
        let generationOriginalBrief = '';
        let generationClarificationRound = 0;
        let agentMessageSequence = 0;
        let agentRetryTimerId = null;
        let statsDeliverySuccessTimerId = null;
        let agentActionMenuElement = null;
        let agentActionMenuOutsideHandler = null;

        const shellEl = document.querySelector('.shell');
        const workspaceEl = document.querySelector('.workspace');
        const mainEl = document.querySelector('.main');
        const listContainer = document.getElementById('results');
        const reactResultsContainer = document.getElementById('react-results');
        const toastEl = document.getElementById('toast');
        const statsDeliveryStatusEl = document.getElementById(
          'stats-delivery-status',
        );
        const topChromeContainer = document.getElementById('react-top-section');
        const leftChromeContainer =
          document.getElementById('react-left-section');
        const viewSegmentedControl = document.querySelector(

          const firstElement = focusableElements[0];
          const lastElement = focusableElements[focusableElements.length - 1];
          if (event.shiftKey && document.activeElement === firstElement) {

        /* ====== Рендер шапки табов ====== */
        function renderTabs() {
          syncChromeState();
        }

        function setActiveTab(tabId) {
          if (!tabConfig.length) {
            currentTab = tabId;
            return;
          }
          const visibleTabs = getVisibleTabs();
          const tab = visibleTabs.find((entry) => entry.id === tabId);
          if (!tab) {
            const fallbackTab = visibleTabs[0] ?? null;
            if (fallbackTab) {
              currentTab = fallbackTab.id;
              updateActiveTabClasses();
              renderList();
            }
            return;
          }
          currentTab = tab.id;
          updateActiveTabClasses();
          renderList();
        }

        function updateActiveTabClasses() {
          syncChromeState();
        }

        /* ======== Рендер текущего таба и маршрутизация ======= */
        function renderList() {
          if (!listContainer) return;
          hideReactResults();
          listContainer.innerHTML = '';

          const tab = getVisibleTabs().find((entry) => entry.id === currentTab);
          if (!tab) {
            showPlaceholder('Выберите таб');
            return;
          }

          const sourceItems = tab.source();
          const items = Array.isArray(sourceItems) ? sourceItems : [];

          if (!currentResults) {
            if (catalogsLoading || !catalogsReady) {
              showMainPlaceholder();
              return;
            }

            if (!scanCompleted) {
              showMainPlaceholder();
              return;
            }

            showPlaceholder('Пока ничего не найдено');
            return;
          }

          if (
            shouldUseAuditReactResults(tab.id) &&
            renderCurrentReactResults(items, tab.id)
          ) {
            return;
          }

          if (tab.id === 'detached' && renderDetachedReactResults(items)) {
            return;
          }

          if (tab.id === 'themization' && renderThemizationReactResults(items)) {
            return;
          }

          if (
            (tab.id === 'changes' || tab.id === 'changesWip') &&
            renderCustomizationReactResults(items, {
              rawBaseline: tab.id === 'changesWip',
            })
          ) {
            return;
          }

          if (
            tab.id === 'deprecatedStyles' &&
            renderDeprecatedStylesReactResults(items)
          ) {
            return;
          }

          if (
            tab.id === 'customStyles' &&
            renderCustomStylesReactResults(items)
          ) {
            return;
          }

          if (!items.length) {
            showPlaceholder(
              tab.emptyMessage ?? 'Нет компонентов по этому критерию',
            );
            return;
          }

          showPlaceholder('Не удалось отрисовать результаты');
        }

        function showPlaceholder(message) {
          if (!listContainer) return;
          hideReactResults();
          listContainer.innerHTML = '';
          const placeholder = document.createElement('div');
          placeholder.className = 'placeholder';
          placeholder.textContent = message;
          listContainer.appendChild(placeholder);
        }

        function showMainPlaceholder() {

              console.error(
                '[Apollo] results bridge placeholder failed',

          }

        function focusNodeById(nodeId) {
          if (!nodeId) return;
          parent.postMessage(
            {
              pluginMessage: {
                type: 'focus-node',
                payload: { id: nodeId },
              },

        function requestFindingAction(actionId) {
          if (!actionId) return;
          parent.postMessage(
            {
              pluginMessage: {
                type: 'execute-finding-action',
                payload: { actionId },
              },

        function mapFindingActions(actions, scope) {
          if (!Array.isArray(actions)) return [];
          return actions
            .filter(
              (action) =>
                action &&
                action.id &&
                action.targetName &&
                (!scope || action.scope === scope),
            )
            .map((action) => ({
              id: action.id,
              label: action.label || 'Применить',
              targetName:
                scope === 'customStyles' && action.targetLibrary
                  ? action.targetName + ' · ' + action.targetLibrary
                  : action.targetName,
              onPress: () => requestFindingAction(action.id),
            }));
        }

        function requestCustomizationReset(
          rootId,
          nodeId,
          messages,
          details = [],
          remediations = [],
        ) {
          if (
            !rootId ||
            !nodeId ||
            (!Array.isArray(messages) &&
              !Array.isArray(details) &&
              !Array.isArray(remediations)) ||
            (!messages.length && !details.length && !remediations.length)
          ) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'reset-customization-group',
                payload: {
                  rootId,
                  nodeId,
                  messages,
                  details,
                  remediations,
                },
              },
            },
            '*',
          );
        }

        function buildCustomizationResetActions(rootId, group) {
          if (!rootId || !group?.nodeId) {
            return [];
          }

          const actions = [];
          const remediationChoices = Array.isArray(group.remediationChoices)
            ? group.remediationChoices
            : [];
          for (const choice of remediationChoices) {
            actions.push({
              label: remediationChoices.length === 1 ? 'Сбросить' : choice.label,
              targetName: choice.label,
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  [],
                  [],
                  [choice.remediation],
              ),
            });
          }
          if (remediationChoices.length) {
            return actions;
          }
          const allRemediations = Array.isArray(group.remediations)
            ? group.remediations
            : [];
          const bindingRemediations = allRemediations.filter(
            (item) => item?.kind === 'bind-layout-variable',
          );
          const componentRemediations = allRemediations.filter(
            (item) => item?.kind !== 'bind-layout-variable',
          );
          const hasTokenBindings = bindingRemediations.length > 0;
          const hasComponentProperties =
            componentRemediations.length > 0;
          const hasLayerProperties =
            (Array.isArray(group.details) && group.details.length > 0) ||
            (Array.isArray(group.messages) && group.messages.length > 0);

          if (hasTokenBindings) {
            actions.push({
              label: 'Привязать',
              targetName: 'Привязать padding к токенам Spacing',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  [],
                  [],
                  bindingRemediations,
                ),
            });
          }

          if (hasComponentProperties && hasLayerProperties) {
            const allMessages = [
              ...(Array.isArray(group.messages) ? group.messages : []),
              ...(Array.isArray(group.details)
                ? group.details
                    .map((detail) => detail?.message)
                    .filter((message) => typeof message === 'string' && message.length)
                : []),
            ];
            actions.push({
              label: 'Сбросить всё',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  allMessages,
                  [],
                  componentRemediations,
                ),
            });
          }

          if (hasComponentProperties) {
            actions.push({
              label: hasLayerProperties ? 'Параметры' : 'Сбросить',
              targetName: 'Параметры компонента',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  [],
                  [],
                  componentRemediations,
                ),
            });
          }

          if (hasLayerProperties) {
            actions.push({
              label: hasComponentProperties ? 'Слой' : 'Сбросить',
              targetName: 'Параметры слоя',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  group.messages,
                  group.details,
                  [],
                ),
            });
          }

          return actions;
        }

        function getLayoutTokenBindingRemediation(diff) {
          const property = diff?.details?.property;
          const actual = diff?.details?.actual;
          if (
            typeof property !== 'string' ||
            !/^layout\.padding\.(top|right|bottom|left)$/.test(property) ||
            typeof actual?.value !== 'number' ||
            actual?.resourceType === 'token' ||
            actual?.bindingId ||
            actual?.binding
          ) {
            return null;
          }
          const evidenceSource =
            diff?.assessment?.evidence?.requiredTokenSource ?? null;
          const ruleSource = Array.isArray(diff?.componentRules)
            ? diff.componentRules.find(
                (rule) =>
                  rule?.severity === 'error' &&
                  rule?.requiredTokenSource?.collection,
              )?.requiredTokenSource ?? null
            : null;
          const tokenSource = evidenceSource || ruleSource;
          const collectionName = tokenSource?.collection;
          if (
            diff?.assessment?.verdict !== 'violation' ||
            typeof collectionName !== 'string' ||
            !collectionName.trim()
          ) {
            return null;
          }
          return {
            kind: 'bind-layout-variable',
            nodeId: diff.nodeId,
            property,
            collectionName: collectionName.trim(),
            value: actual.value,
          };
        }

        function findInterpretedCustomizationDiff(nodeId, property) {
          if (typeof nodeId !== 'string' || typeof property !== 'string') {
            return null;
          }
          const matches = [];
          resolveViewArray(['changes']).forEach((item) => {
            prepareChangeDiffs(item).forEach((candidate) => {
              if (
                candidate?.nodeId === nodeId &&
                candidate?.details?.property === property
              ) {
                matches.push(candidate);
              }
            });
          });
          return matches.length === 1 ? matches[0] : null;
        }

        function buildAgentFindingResetActions(finding) {
          if (
            !finding ||
            finding.verdict !== 'confirmed' ||
            finding.priority !== 'error' ||
            typeof finding.nodeId !== 'string' ||
            typeof finding.factPath !== 'string' ||
            !currentResults
          ) {
            return [];
          }
          const matches = [];
          const items = resolveViewArray(['changesWip']);
          items.forEach((item) => {
            prepareBaselineChangeDiffs(item).forEach((diff) => {
              if (
                diff?.nodeId === finding.nodeId &&
                diff?.details?.property === finding.factPath
              ) {
                matches.push({ item, diff });
              }
            });
          });
          if (matches.length !== 1) {
            return [];
          }

          const match = matches[0];
          const diff = match.diff;
          const interpretedDiff = findInterpretedCustomizationDiff(
            finding.nodeId,
            finding.factPath,
          );
          const property = diff.details?.property;
          const isVariantDiff =
            typeof property === 'string' && property.indexOf('variant.') === 0;
          const isStructuralCompositionDiff =
            typeof property === 'string' && property.indexOf('composition.') === 0;
          let remediation = diff.assessment?.remediation;
          if (!remediation) {
            remediation = getLayoutTokenBindingRemediation(
              interpretedDiff || diff,
            );
          }
          let remediationChoices = [];
          if (!remediation && isVariantDiff && diff.nodeId) {
            const variantProperty = property.slice('variant.'.length);
            remediationChoices = getVariantRemediationChoices(
              diff,
              variantProperty,
            );
            const referenceValue = diff.details?.reference?.value;
            const remediationValue = remediationChoices.length === 1
              ? remediationChoices[0].label
              : remediationChoices.length
                ? null
                : referenceValue;
            if (
              variantProperty &&
              typeof remediationValue === 'string' &&
              remediationValue.length
            ) {
              remediation = {
                kind: 'set-variant-properties',
                nodeId: diff.nodeId,
                properties: { [variantProperty]: remediationValue },
              };
            }
          }
          if (isStructuralCompositionDiff && !remediation) {
            return [];
          }
          const details = getCustomizationResetDetails(diff, true, remediation);
          const group = {
            nodeId: diff.nodeId,
            messages:
              !remediation && !remediationChoices.length && !details.length
                ? [diff.message]
                : [],
            details,
            remediations: remediation ? [remediation] : [],
            remediationChoices,
          };
          return buildCustomizationResetActions(match.item.id, group);
        }

        function findAgentFindingById(findingId) {
          if (!findingId) return null;
          for (const message of agentReportMessages) {
            const findings = Array.isArray(message.findings) ? message.findings : [];
            const finding = findings.find((entry) => entry?.id === findingId);
            if (finding) return finding;
          }
          return null;
        }

        function closeAgentActionMenu() {
          if (agentActionMenuOutsideHandler) {
            document.removeEventListener('mousedown', agentActionMenuOutsideHandler);
            agentActionMenuOutsideHandler = null;
          }
          agentActionMenuElement?.remove();
          agentActionMenuElement = null;
        }

        function openAgentActionMenu(anchor, actions) {
          closeAgentActionMenu();
          const menu = document.createElement('div');
          menu.className = 'agent-action-menu';
          menu.setAttribute('role', 'menu');
          actions.forEach((action) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'agent-action-menu__item';
            button.setAttribute('role', 'menuitem');
            button.textContent = action.targetName || action.label || 'Сбросить';
            button.addEventListener('click', (event) => {
              event.stopPropagation();
              closeAgentActionMenu();
              action.onPress();
            });
            menu.appendChild(button);
          });
          document.body.appendChild(menu);
          const rect = anchor.getBoundingClientRect();
          const menuRect = menu.getBoundingClientRect();
          const safeMargin = 24;
          const top = window.innerHeight - rect.bottom >= menuRect.height + safeMargin
            ? rect.bottom + 6
            : Math.max(safeMargin, rect.top - menuRect.height - 6);
          const left = Math.max(
            safeMargin,
            Math.min(
              rect.right - menuRect.width,
              window.innerWidth - menuRect.width - safeMargin,
            ),
          );
          menu.style.top = `${top}px`;
          menu.style.left = `${left}px`;
          agentActionMenuElement = menu;
          agentActionMenuOutsideHandler = (event) => {
            if (!menu.contains(event.target) && !anchor.contains(event.target)) {
              closeAgentActionMenu();
            }
          };
          setTimeout(() => {
            if (agentActionMenuOutsideHandler) {
              document.addEventListener('mousedown', agentActionMenuOutsideHandler);
            }
          }, 0);
          menu.querySelector('button')?.focus();
        }

        function activateAgentFindingAction(actionCell) {
          const finding = findAgentFindingById(
            actionCell.getAttribute('data-agent-finding-action'),
          );
          const actions = buildAgentFindingResetActions(finding);
          if (actions.length === 1) {
            actions[0].onPress();
            return;
          }
          if (actions.length > 1) {
            openAgentActionMenu(actionCell, actions);
          }
        }

        function sortCustomizationGroupsByPath(groups) {
          return groups
            .map((group) => ({
              group,
              order: getCustomizationGroupSortOrder(group, groups),
            }))
            .sort((left, right) => compareCustomizationGroupSortEntries(left, right))
            .map((entry) => entry.group);
        }

        function compareCustomizationGroupSortEntries(leftEntry, rightEntry) {
          const left = leftEntry.group;
          const right = rightEntry.group;
          const leftPath = getCustomizationGroupPath(left);
          const rightPath = getCustomizationGroupPath(right);
          if (leftEntry.order !== rightEntry.order) {
            return leftEntry.order - rightEntry.order;
          }
          if (leftPath === rightPath) {
            return (left?.order ?? 0) - (right?.order ?? 0);
          }
          if (isAncestorPath(leftPath, rightPath)) {
            return -1;
          }
          if (isAncestorPath(rightPath, leftPath)) {
            return 1;
          }

          return (left?.order ?? 0) - (right?.order ?? 0);
        }

        function getCustomizationGroupSortOrder(group, groups) {
          const groupPath = getCustomizationGroupPath(group);
          let order = group?.order ?? 0;
          groups.forEach((candidate) => {
            const candidatePath = getCustomizationGroupPath(candidate);
            if (isAncestorPath(groupPath, candidatePath)) {
              order = Math.min(order, candidate?.order ?? order);
            }
          });
          return order;
        }

        function getCustomizationGroupPath(group) {
          return String(group?.nodePath || group?.name || '');
        }

        function isAncestorPath(parentPath, childPath) {
          if (!parentPath || !childPath || parentPath === childPath) {
            return false;
          }
          return childPath.indexOf(`${parentPath} / `) === 0;
        }

        function requestThemizationAction(
          kind,
          nodeId,
          themeCollectionId,
          targetModeId,
          replacementComponentKey,
        ) {
          if (!kind || !nodeId) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'apply-themization-action',
                payload: {
                  kind,
                  nodeId,
                  themeCollectionId,
                  targetModeId,
                  replacementComponentKey,
                },
              },
            },
            '*',
          );
        }

        function showReactResults() {
          if (reactResultsContainer) {
            reactResultsContainer.style.display = 'flex';
          }
          if (listContainer) {
            listContainer.style.display = 'none';
          }
        }

        function hideReactResults() {
          if (reactResultsContainer) {
            reactResultsContainer.style.display = 'none';
          }
          if (listContainer) {
            listContainer.style.display = 'flex';
          }
          if (resultsBridge && resultsBridgeMounted) {
            try {
              resultsBridge.clear();
            } catch (error) {
              resultsBridgeMounted = false;
              console.error('[Apollo] results bridge clear failed', error);
            }
          }
        }

        function renderCurrentReactResults(items, actionScope) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((item) => ({
            kind: 'audit',
            id: item.id,
            focusId: item.focusNodeId || item.id,
            title: item.name ?? 'Без названия',
            caption: getAuditItemCaption(item) ?? undefined,
            actions: mapFindingActions(item.actions, actionScope),
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderCustomStylesReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'customStyle',
            id: entry.id,
            title: entry.name || entry.pageName || 'Слой',
            caption: formatCustomStyleReason(entry.reason || '') || undefined,
            actions: mapFindingActions(entry.actions, 'customStyles'),
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderDeprecatedStylesReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const groupedEntries = groupDeprecatedStyleEntries(items);
          const reactItems = groupedEntries.map((group) => ({
            kind: 'deprecatedStyle',
            id: group.id,
            title: '❌ ' + (group.styleLabel || 'Unknown style'),
            caption: group.sourceLibrary || formatDeprecatedStyleSource(group.sourceFile),
            usages: group.usages.map((usage) => ({
              id: usage.id,
              name: formatDeprecatedStyleReason(usage.reason || ''),
              onFocus: usage.id ? () => focusNodeById(usage.id) : undefined,
              actions: mapFindingActions(usage.actions, 'deprecatedStyles'),
            })),
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderDetachedReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'detached',
            id: entry.id,
            title: entry.name || 'Слой',
            caption: entry.libraryName || undefined,
            targetName: entry.componentName || 'Source Component Name',
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderThemizationReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'themization',
            id: entry.nodeId || entry.id,
            title: entry.name || 'Темизация',
            caption:
              entry.kind === 'corporateComponent'
                ? entry.libraryName || undefined
                : undefined,
            targetName: entry.recommendation || 'Проверьте настройки темизации',
            onReplace:
              entry.nodeId &&
              (entry.kind === 'corporateComponent' || entry.kind === 'missingThemeMode')
              ? () =>
                  requestThemizationAction(
                    entry.kind,
                    entry.nodeId,
                    entry.themeCollectionId,
                    entry.targetModeId,
                    entry.replacementComponentKey,
                  )
              : undefined,
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function parseCustomizationDiffMessage(message) {
          if (typeof message !== 'string') {
            return null;
          }

          const trimmed = message.trim();
          if (!trimmed) {
            return null;
          }

          const separatorIndex = trimmed.indexOf(':');
          if (separatorIndex === -1) {
            return {
              label: 'Изменение',
              values: [trimmed],
            };
          }

          const rawLabel = trimmed.slice(0, separatorIndex).trim();
          const rawValue = trimmed.slice(separatorIndex + 1).trim();

          if (!rawValue) {
            return {
              label: rawLabel || 'Изменение',
              values: ['—'],
            };
          }

          const parts = rawValue
            .split('→')
            .map((part) => part.trim())
            .filter(Boolean);

          return {
            label: rawLabel || 'Изменение',
            values: parts.length ? parts : [rawValue],
          };
        }

        function getCustomizationDetailDisplayValue(detail) {
          if (!detail || typeof detail !== 'object') {
            return null;
          }

          const candidates = [
            detail.displayName,
            detail.binding && detail.binding.name,
            detail.resource && detail.resource.name,
            detail.value,
          ];
          for (const candidate of candidates) {
            if (typeof candidate === 'number') {
              return String(candidate);
            }
            if (typeof candidate === 'string' && candidate.trim()) {
              return candidate.trim();
            }
          }
          return null;
        }

        function getCustomizationStructuredValues(diff) {
          const details = diff && diff.details;
          if (!details || !details.reference || !details.actual) {
            return null;
          }

          return [
            getCustomizationDetailDisplayValue(details.reference) || '—',
            getCustomizationDetailDisplayValue(details.actual) || '—',
          ];
        }

        function getVariantRemediationChoices(diff, property) {
          if (!diff?.nodeId || !property) {
            return [];
          }
          const expected = diff.assessment?.evidence?.expected;
          if (!Array.isArray(expected)) {
            return [];
          }
          return Array.from(
            new Set(
              expected.filter(
                (value) => typeof value === 'string' && value.length,
              ),
            ),
          ).map((value) => ({
            label: value,
            remediation: {
              kind: 'set-variant-properties',
              nodeId: diff.nodeId,
              properties: { [property]: value },
            },
          }));
        }

        function renderCustomizationReactResults(items, options = {}) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const rawBaseline = options.rawBaseline === true;

          const reactItems = items
            .map((item) => {
              const diffs = rawBaseline
                ? prepareBaselineChangeDiffs(item)
                : prepareChangeDiffs(item);
              if (!diffs.length) {
                return null;
              }

              const groupsMap = new Map();
              diffs.forEach((diff, index) => {
                const groupId =
                  diff.nodeId ||
                  diff.nodePath ||
                  diff.nodeName ||
                  `${item.id}:diff:${index}`;
                const existing = groupsMap.get(groupId);
                const parsed = parseCustomizationDiffMessage(diff.message);
                const structuredValues = getCustomizationStructuredValues(diff);
                const isVariantDiff =
                  typeof diff.details?.property === 'string' &&
                  diff.details.property.indexOf('variant.') === 0;
                const isBindingDiff =
                  typeof diff.details?.bindingStatus === 'string' ||
                  Boolean(diff.details?.variableMode);
                const marker = rawBaseline
                  ? undefined
                  :
                  (diff.assessment?.verdict === 'expected' ||
                    diff.assessment?.verdict === 'allowed')
                    ? 'Expected'
                    : undefined;
                const ruleText = rawBaseline
                  ? undefined
                  :
                  diff.assessment?.verdict === 'violation' &&
                  typeof diff.assessment?.message === 'string' &&
                  diff.assessment.message.trim()
                    ? diff.assessment.message.trim()
                    : undefined;
                const line = parsed
                  ? {
                      ...parsed,
                      values: structuredValues || parsed.values,
                      marker,
                      ruleText,
                    }
                  : {
                      label: 'Изменение',
                      values:
                        structuredValues || [(diff.message || '').trim() || '—'],
                      marker,
                      ruleText,
                    };
                const interpretedDiff = rawBaseline
                  ? findInterpretedCustomizationDiff(
                      diff.nodeId,
                      diff.details?.property,
                    )
                  : null;
                const remediationSource = interpretedDiff || diff;
                let remediation = remediationSource.assessment?.remediation;
                if (!remediation) {
                  remediation = getLayoutTokenBindingRemediation(
                    remediationSource,
                  );
                }
                let remediationChoices = [];
                const isStructuralCompositionDiff =
                  typeof diff.details?.property === 'string' &&
                  diff.details.property.indexOf('composition.') === 0;
                const canReset =
                  (rawBaseline ||
                    (diff.assessment?.verdict !== 'expected' &&
                      diff.assessment?.verdict !== 'allowed')) &&
                  (!isStructuralCompositionDiff || Boolean(remediation));
                if (!remediation && canReset && isVariantDiff && diff.nodeId) {
                  const property = diff.details?.property?.slice('variant.'.length);
                  const referenceValue = diff.details?.reference?.value;
                  remediationChoices = getVariantRemediationChoices(
                    diff,
                    property,
                  );
                  const remediationValue = remediationChoices.length
                    ? remediationChoices.length === 1
                      ? remediationChoices[0].label
                      : null
                    : referenceValue;
                  if (
                    property &&
                    typeof remediationValue === 'string' &&
                    remediationValue.length
                  ) {
                    remediation = {
                      kind: 'set-variant-properties',
                      nodeId: diff.nodeId,
                      properties: {
                        [property]: remediationValue,
                      },
                    };
                  }
                }
                const resetDetails = getCustomizationResetDetails(
                  diff,
                  canReset,
                  remediation,
                );

                if (existing) {
                  const sectionLines = isVariantDiff
                    ? existing.componentLines
                    : isBindingDiff
                      ? existing.bindingLines
                      : existing.layerLines;
                  sectionLines.push(line);
                  if (resetDetails.length) {
                    existing.details.push(...resetDetails);
                  } else if (
                    canReset &&
                    !remediation &&
                    !remediationChoices.length
                  ) {
                    existing.messages.push(diff.message);
                  }
                  if (
                    remediation &&
                    !existing.remediations.some(
                      (item) =>
                        item.kind === remediation.kind &&
                        item.nodeId === remediation.nodeId &&
                        JSON.stringify(item) === JSON.stringify(remediation),
                    )
                  ) {
                    existing.remediations.push(remediation);
                  }
                  for (const choice of remediationChoices) {
                    if (
                      !existing.remediationChoices.some(
                        (item) =>
                          item.label === choice.label &&
                          JSON.stringify(item.remediation.properties) ===
                            JSON.stringify(choice.remediation.properties),
                      )
                    ) {
                      existing.remediationChoices.push(choice);
                    }
                  }
                  return;
                }

                const group = {
                  id: groupId,
                  name: diff.nodeName || diff.nodePath || 'Слой',
                  nodePath: diff.nodePath || '',
                  order: groupsMap.size,
                  onFocus: diff.nodeId
                    ? () => focusNodeById(diff.nodeId)
                    : undefined,
                  nodeId: diff.nodeId,
                  componentLines: isVariantDiff ? [line] : [],
                  bindingLines:
                    !isVariantDiff && isBindingDiff ? [line] : [],
                  layerLines:
                    !isVariantDiff && !isBindingDiff ? [line] : [],
                  messages:
                    canReset &&
                    !remediation &&
                    !remediationChoices.length &&
                    !resetDetails.length
                      ? [diff.message]
                      : [],
                  details: resetDetails,
                  remediations: remediation ? [remediation] : [],
                  remediationChoices,
                };

                groupsMap.set(groupId, group);
              });

              const groups = sortCustomizationGroupsByPath(Array.from(groupsMap.values()))
                .map((group) => {
                  const actions = buildCustomizationResetActions(item.id, group);
                  return {
                    id: group.id,
                    name: group.name,
                    onFocus: group.onFocus,
                    lines: [
                    ...(group.componentLines.length
                      ? [
                          {
                            label: 'Параметры компонента',
                            values: [],
                          },
                          ...group.componentLines,
                        ]
                      : []),
                    ...(group.bindingLines.length
                      ? [
                          {
                            label: 'Переменные',
                            values: [],
                          },
                          ...group.bindingLines,
                        ]
                      : []),
                    ...(group.layerLines.length
                      ? [
                          {
                            label: 'Параметры слоя',
                            values: [],
                          },
                          ...group.layerLines,
                        ]
                      : []),
                    ],
                    actions,
                    actionPickerLabel:
                      group.remediationChoices.length > 1
                        ? 'Заменить'
                        : actions.length > 1
                          ? group.remediations.some(
                              (item) => item?.kind === 'bind-layout-variable',
                            )
                            ? 'Привязать'
                            : 'Сбросить'
                          : undefined,
                    onReset:
                      (group.messages.length ||
                        group.details.length ||
                        group.remediations.length) &&
                      group.nodeId
                        ? () =>
                            requestCustomizationReset(
                              item.id,
                              group.nodeId,
                              group.messages,
                              group.details,
                              group.remediations,
                            )
                        : undefined,
                  };
                });
              if (!groups.length) {
                return null;
              }

              return {
                kind: 'customization',
                id: item.id,
                title: item.name ?? 'Без названия',
                caption: [
                  getItemLibraryName(item),
                  rawBaseline && item.id ? `node ${item.id}` : null,
                ]
                  .filter(Boolean)
                  .join(' · ') || undefined,
                groups,
              };
            })
            .filter(Boolean);

          if (!reactItems.length) {
            return false;
          }

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function shouldUseAuditReactResults(tabId) {
          return (
            tabId === 'current' ||
            tabId === 'technical' ||
            tabId === 'deprecated' ||
            tabId === 'wrongChannel' ||
            tabId === 'update' ||
            tabId === 'presets' ||
            tabId === 'local'
          );
        }

        const TECHNICAL_DIFF_PATTERN = /(Token\s)|(token:)|(VariableID:)/i;

        function isTechnicalDiff(diff) {
          if (!diff || typeof diff.message !== 'string') return false;
          return TECHNICAL_DIFF_PATTERN.test(diff.message);
        }

        function getDiffKey(diff) {
          const locationKey =
            diff.nodeId ??
            diff.nodePath ??
            diff.nodeName ??
            'diff';
          const propertyKey =
            diff.details?.property ?? String(diff.message ?? 'change');
          return `${locationKey}:${propertyKey}`;
        }

        function dedupeDiffs(diffs) {
          const seen = new Map();
          const normalized = [];
          for (const diff of diffs) {
            const key = getDiffKey(diff);
            const currentIsTech = isTechnicalDiff(diff);
            const existing = seen.get(key);
            if (existing) {
              const existingIsTech = isTechnicalDiff(existing.diff);
              if (!currentIsTech && existingIsTech) {
                normalized[existing.index] = diff;
                seen.set(key, { diff, index: existing.index });
                continue;
              }
              if (currentIsTech) {
                continue;
              }
            }
            const index = normalized.length;
            normalized.push(diff);
            seen.set(key, { diff, index });
          }
          return normalized;
        }

        function getCustomizationResetDetails(diff, canReset, remediation) {
          if (!canReset || remediation || !diff?.details) return [];
          const sourceDetails =
            Array.isArray(diff.details.atomicChanges) &&
            diff.details.atomicChanges.length
              ? diff.details.atomicChanges
              : [diff.details];
          return sourceDetails.map((detail) => ({
            property: detail.property,
            reference: detail.reference,
            message: diff.message,
            resetSurface:
              diff.assessment?.evidence?.resetSurface === 'layer' &&
              (detail.property === 'fill' || detail.property === 'stroke')
                ? 'paint'
                : undefined,
          }));
        }

        /**
         * Убирает скрытые diff-ы и технические строки, оставляя человекочитаемые записи
         * для таба «Кастомизация» и рендерингового конца.
         */
        function prepareChangeDiffs(item) {
          const rawDiffs = Array.isArray(item.diffs) ? item.diffs : [];
          const visibleDiffs = showExpectedCustomizations
            ? rawDiffs
            : rawDiffs.filter(
                (diff) =>
                  diff?.assessment?.verdict !== 'expected' &&
                  diff?.assessment?.verdict !== 'allowed',
              );

          return dedupeDiffs(visibleDiffs);
        }

        function prepareBaselineChangeDiffs(item) {
          const rawDiffs = Array.isArray(item.diffs) ? item.diffs : [];
          return rawDiffs.filter((diff) => diff?.visible !== false);
        }

        function getVisibleCustomizationItems() {
          return resolveViewArray(['changes']).filter(
            (item) => prepareChangeDiffs(item).length > 0,
          );
        }

        function setScanningState(active) {
          isScanning = active;
          actionPhase = active ? 'scanning' : getIdleActionPhase();
          refreshScanButton();
          updateLoaderVisibility();
        }

        function getIdleActionPhase() {
          if (catalogsLoading || !catalogsReady) {
            return 'catalog-loading';
          }
          return 'idle';
        }

        function getItemLibraryName(item) {
          if (item.librarySource) {
            return item.librarySource;
          }
          if (item.reference) {
            return item.reference.source ?? 'Дизайн-система';
          }
          if (item.isLocal) {
            return 'Локальный';
          }
          return null;
        }

        function getAuditItemCaption(item) {
          const libraryName = getItemLibraryName(item);
          const updateReasons = Array.isArray(item.updateReasons)
            ? item.updateReasons
            : [];
          if (updateReasons.includes('library-update-available')) {
            const ownerName = item.localComponentOwner?.name;
            const variantName = item.resolvedReferenceVariantName;
            const variantCaption = variantName ? ` · ${variantName}` : '';
            const freshnessCaption = libraryName
              ? `Доступна новая версия · ${libraryName}`
              : 'Доступна новая версия';
            return ownerName
              ? `${freshnessCaption}${variantCaption} · внутри ${ownerName}`
              : `${freshnessCaption}${variantCaption}`;
          }
          return libraryName;
        }

        function formatCustomStyleReason(reason) {
          if (reason.startsWith('effect:')) {
            return reason.split(':')[1];
          }
          if (reason === 'typography') {
            return 'Типографика';
          }
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            case 'style':
              return 'Стили';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleReason(reason) {
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleSource(sourceFile) {
          if (!sourceFile) {
            return 'Unknown style catalog';
          }

          return sourceFile
            .replace(/^styles\//i, '')
            .replace(/\.json$/i, '');
        }

        function groupDeprecatedStyleEntries(items) {
          const groups = new Map();

          for (const entry of items) {
            const key = [
              entry.styleLabel || '',
              entry.sourceFile || '',
            ].join('|');

            if (!groups.has(key)) {
              groups.set(key, {
                id: key || entry.id,
                styleLabel: entry.styleLabel || 'Unknown style',
                sourceFile: entry.sourceFile || 'Unknown style catalog',
                sourceLibrary:
                  entry.sourceLibrary ||
                  entry.sourceFile ||
                  'Unknown style catalog',
                usages: [],
              });
            }

            groups.get(key).usages.push(entry);
          }

          return Array.from(groups.values());
        }

        window.onmessage = (event) => {
          const msg = event.data?.pluginMessage;
          if (!msg) return;

          if (msg.type === 'tab-config') {
            initializeTabConfig(msg.payload);
            return;
          }

          if (msg.type === 'scan-started') {
            listContainer.innerHTML = '';
            setScanningState(true);
            scanCompleted = false;
            agentReportMeta = null;
            patternReportMeta = null;
            textReportMeta = null;
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            agentActiveRequestKind = null;
            agentRequestedPatternReportId = null;
            agentRequestedTextReportId = null;
            agentReportMessages = [createInitialAgentLoadingMessage(
              'Готовим отчёт по паттернам',
              'report',
            )];
            agentTextMessages = [createInitialAgentLoadingMessage(
              'Готовим проверку текстов',
              'texts',
            )];
            activeApolloView = 'audit';
            if (agentComposerInput) {
              agentComposerInput.value = '';
              resizeAgentComposerInput();
            }
            syncAgentViewState();
            renderAgentMessages();
          }

          if (msg.type === 'scan-finished') {
            setScanningState(false);
            return;
          }

          if (msg.type === 'scan-cancelled') {
            setScanningState(false);
            showToast('Проверка остановлена');
            if (currentResults) {
              renderList();
            } else if (listContainer) {
              listContainer.innerHTML =
                '<div class="placeholder">Проверка остановлена.</div>';
            }
            return;
          }

          if (msg.type === 'scan-result') {
            currentResults = msg.payload;
            scanCompleted = true;
            syncAgentViewState();
            updateActiveTabClasses();
            renderList();
            showToast(
              `Проверено компонентов: ${currentResults.summary.totalTargets}`,
            );
            return;
          }

          if (msg.type === 'scan-error') {
            actionPhase = getIdleActionPhase();
            showToast(msg.payload?.message ?? 'Не удалось выполнить проверку');
            scanCompleted = false;
            agentReportMeta = null;
            patternReportMeta = null;
            activeApolloView = 'audit';
            syncAgentViewState();
            return;
          }

          if (msg.type === 'apollo-stats-delivery-status') {
            renderStatsDeliveryStatus(msg.payload || {});
            return;
          }

          if (msg.type === 'generation-example-started') {
            showToast('Собираем пример…');
            return;
          }

          if (msg.type === 'generation-example-ready') {
            downloadJsonDocument(
              msg.payload?.document,
              msg.payload?.suggestedFileName,
            );
            const warningCount = Number(msg.payload?.warningCount || 0);
            showToast(
              warningCount > 0
                ? `Пример собран · предупреждений: ${warningCount}`
                : 'Пример собран',
            );
            return;
          }

          if (msg.type === 'generation-example-error') {
            showToast(msg.payload?.message ?? 'Не удалось собрать пример');
            return;
          }

          if (msg.type === 'apollo-agent-report-ready') {
            agentReportMeta = msg.payload || null;
            return;
          }

          if (msg.type === 'apollo-pattern-report-ready') {
            patternReportMeta = msg.payload || null;
